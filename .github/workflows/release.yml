name: community-release

on:
  push:
    tags: ["v*"]

concurrency:
  group: community-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish Community Edition
    if: github.repository == 'everstacklabs/everstack'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate release source and version
        run: |
          set -euo pipefail
          test "$(cat .github/PUBLIC_PROJECTION)" = "everstack-public-projection-v1"
          git fetch --no-tags origin master
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          bash build/install.sh --check-version "$GITHUB_REF_NAME"
          python3 .github/scripts/test_validate_public_repo.py
          python3 .github/scripts/validate-public-repo.py .

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Community Edition backend
        run: go test -tags=ce ./...

      - name: Build embedded admin UI
        run: |
          set -euo pipefail
          pnpm --filter @everstack/admin... build
          rm -rf ui/dist
          mkdir -p ui/dist
          cp -R apps/admin/dist/. ui/dist/
          git diff --exit-code

      - name: Build Community Edition binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="$GITHUB_REF_NAME"
          BUILD_DATE=$(git show -s --format=%cI "$GITHUB_SHA")
          LDFLAGS="-s -w -X github.com/everstacklabs/everstack/cmd/build.version=${VERSION} -X github.com/everstacklabs/everstack/cmd/build.commit=${GITHUB_SHA} -X github.com/everstacklabs/everstack/cmd/build.date=${BUILD_DATE}"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            output="dist/everstack-${GOOS}-${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -tags="ui_embed,ce" -trimpath -ldflags "$LDFLAGS" \
              -o "$output" .
            gzip -n -9 "$output"
          done

          gunzip -c dist/everstack-linux-amd64.gz > /tmp/everstack
          chmod +x /tmp/everstack
          /tmp/everstack --version
          (cd dist && sha256sum everstack-*.gz | LC_ALL=C sort -k2 > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/everstack-*.gz
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Everstack $GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi
