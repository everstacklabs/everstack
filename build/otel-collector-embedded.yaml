# Minimal OTEL Collector for Self-Hosted Deployments
# Runs as sidecar on localhost:4317
# Exports to customer's ClickHouse instance using official exporter

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317

processors:
  batch:
    timeout: 1s # Fast batching for low latency
    send_batch_size: 100

exporters:
  clickhouse:
    endpoint: tcp://${CLICKHOUSE_HOST}:9000?dial_timeout=10s&compress=lz4
    database: ${CLICKHOUSE_DATABASE}
    username: ${CLICKHOUSE_USERNAME}
    password: ${CLICKHOUSE_PASSWORD}
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

service:
  telemetry:
    logs:
      level: warn
    metrics:
      level: detailed
      # Note: address is configured via command-line flag --metrics-addr
      # or via environment variable OTEL_METRICS_ADDR

  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
