providers:
    anthropic:
        api_version: "2023-06-01"
        auth:
            env_var: ANTHROPIC_API_KEY
            header_format: '{api_key}'
            header_name: x-api-key
            type: api_key
        base_url: https://api.anthropic.com/v1
        capabilities:
            assistants: false
            chat: true
            completions: false
            embeddings: false
            fine_tuning: false
            function_calling: true
            streaming: true
            vision: true
        defaults:
            max_tokens: 1000
            retry_attempts: 3
            retry_delay: 1s
            temperature: 0.7
            timeout: 60s
            top_k: 40
            top_p: 1
        display_name: Anthropic
        error_mapping:
            invalid_api_key: authentication_failed
            model_not_found: model_unavailable
            payment_required: payment_required
            rate_limit_exceeded: rate_limit_exceeded
        model_families:
            claude-3:
                capabilities:
                    - chat
                    - function_calling
                    - vision
                description: Claude 3 family models
                max_tokens: 200000
            claude-3.5:
                capabilities:
                    - chat
                    - function_calling
                    - vision
                description: Claude 3.5 family models
                max_tokens: 200000
            claude-4:
                capabilities:
                    - chat
                    - function_calling
                    - vision
                description: Claude 4 family models
                max_tokens: 200000
        name: anthropic
        provider_type: static
        rate_limits:
            concurrent_requests: 25
            requests_per_minute: 1000
            tokens_per_minute: 50000
        supports_model_discovery: false
    aws-bedrock:
        api_version: "2024-01-01"
        auth:
            env_var: AWS_REGION
            header_format: AWS4-HMAC-SHA256 ...
            header_name: Authorization
            type: aws_sigv4
        base_url: https://bedrock-runtime.{region}.amazonaws.com
        capabilities:
            assistants: false
            chat: true
            completions: true
            embeddings: false
            fine_tuning: false
            function_calling: true
            streaming: true
            vision: true
        defaults:
            max_tokens: 1000
            retry_attempts: 3
            retry_delay: 1s
            temperature: 0.7
            timeout: 60s
            top_p: 1
        display_name: AWS Bedrock
        error_mapping:
            AccessDeniedException: authentication_failed
            ResourceNotFoundException: model_unavailable
            ThrottlingException: rate_limit_exceeded
        model_families:
            claude:
                capabilities:
                    - chat
                    - function_calling
                    - vision
                description: Anthropic Claude via Bedrock
                max_tokens: 200000
            llama:
                capabilities:
                    - chat
                    - function_calling
                description: Meta Llama via Bedrock
                max_tokens: 128000
            mistral:
                capabilities:
                    - chat
                    - function_calling
                description: Mistral via Bedrock
                max_tokens: 128000
            nova:
                capabilities:
                    - chat
                    - function_calling
                    - vision
                description: Amazon Nova family
                max_tokens: 300000
        name: aws-bedrock
        provider_type: static
        rate_limits:
