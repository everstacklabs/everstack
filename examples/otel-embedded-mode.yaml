# Example configuration for OTEL Embedded Mode (Self-hosted deployments)
# This uses direct ClickHouse export without external collector
#
# To test:
# 1. Start services WITHOUT collector: docker-compose -f build/docker-compose-local.yaml up db clickhouse
# 2. Run gateway with this config: ./bin/everstack serve --config examples/otel-embedded-mode.yaml

server:
  config:
    port: 8089
    external_domain: "localhost"

  security:
    api_key_hash_secret: "${EVS_API_KEY_HASH_SECRET}"

  log:
    level: info
    formatter:
      format: text

  telemetry:
    otel:
      enabled: true
      mode: embedded # Use embedded mode (direct ClickHouse)
      service_name: "everstack-gateway"
      tenant_type: "self_hosted"
      instance_owner: "user"
      # Direct export configuration
      direct_export:
        enabled: true
        clickhouse_url: "localhost:9000"
        database: "everstack"
        username: "clickhouse"
        password: "clickhouse"

  tls:
    enabled: false

  cors:
    enabled: true
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:8089"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Origin"
      - "Content-Type"
      - "Accept"
      - "Authorization"
      - "x-evs-api-key"

database:
  mode: hybrid
  postgres:
    dsn: "postgres://postgres:postgres@localhost:5432/everstack?sslmode=disable"
  clickhouse:
    dsn: "clickhouse://clickhouse:clickhouse@localhost:9000/everstack?dial_timeout=10s"

gateway:
  enable_streaming: true
  enable_sse: false

features:
  gateway:
    enable_streaming: true
    enable_sse: false

