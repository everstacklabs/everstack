name: everstack-quickstart

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: everstack
      POSTGRES_USER: everstack
      POSTGRES_PASSWORD: everstack-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everstack -d everstack"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  everstack:
    build:
      context: ../..
      dockerfile: build/Dockerfile
    image: ${EVERSTACK_IMAGE:-everstack-community:local}
    command: ["serve"]
    environment:
      EVS_SERVER_HOST: 0.0.0.0
      EVS_SERVER_PORT: "8089"
      EVS_DATABASE_MODE: single
      EVS_POSTGRES_DSN: postgres://everstack:everstack-local@postgres:5432/everstack?sslmode=disable
      EVS_CACHE_TYPE: memory
      EVS_TELEMETRY_ENABLED: "false"
      EVS_AUTH_MODE: none
      # Development-only value. Generate a unique secret before any shared or
      # production deployment.
      EVS_API_KEY_HASH_SECRET: 9d7c48af6af76dcdbf1cbf0ac83cb7a4498077c8f53a7f80dcc917f401728b8d
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8089/debug/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    volumes:
      - everstack-data:/app/data

volumes:
  postgres-data:
  everstack-data:
