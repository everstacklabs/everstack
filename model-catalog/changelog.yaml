versions:
  - version: "2.13.0"
    date: "2026-11-26"
    description: "11 models on Azure and Amazon Bedrock that the gateway can now serve. Azure: GPT-6.1 Terra, GPT-6.2 Sol and GPT-6.2 Astra, called through Azure's v1 Responses API, and Claude Haiku 5.5 and Claude Fable 5.2, called through the Foundry Messages API. These need a gateway that includes the Azure Responses and Claude routes; an older gateway lists them but cannot call them. An Azure deployment must be named after the model id. Amazon Bedrock: GPT-6.1 Terra, GPT-6.2 Sol and GPT-6.2 Astra through their US and Global inference profiles, which is the form Bedrock's Converse API accepts for these models; prices, including the higher rate for prompts over 272K input tokens, are checked against the AWS model cards. Azure prices are copied from the first-party entries, which match the Azure list prices on models.dev as of 2026-11-26, and were not checked against Azure's own pricing page. All carry the same request-setting exclusions as the first-party models."
    changes:
      new_models:
        - { provider: aws-bedrock, model: "global.openai.gpt-6.1-terra", display_name: "GPT-6.1 Terra (Global) (Bedrock)" }
        - { provider: aws-bedrock, model: "global.openai.gpt-6.2-astra", display_name: "GPT-6.2 Astra (Global) (Bedrock)" }
        - { provider: aws-bedrock, model: "global.openai.gpt-6.2-sol", display_name: "GPT-6.2 Sol (Global) (Bedrock)" }
        - { provider: aws-bedrock, model: "us.openai.gpt-6.1-terra", display_name: "GPT-6.1 Terra (US) (Bedrock)" }
        - { provider: aws-bedrock, model: "us.openai.gpt-6.2-astra", display_name: "GPT-6.2 Astra (US) (Bedrock)" }
        - { provider: aws-bedrock, model: "us.openai.gpt-6.2-sol", display_name: "GPT-6.2 Sol (US) (Bedrock)" }
        - { provider: azure-openai, model: "claude-fable-5-2", display_name: "Claude Fable 5.2 (Azure)" }
        - { provider: azure-openai, model: "claude-haiku-5-5", display_name: "Claude Haiku 5.5 (Azure)" }
        - { provider: azure-openai, model: "gpt-6.1-terra", display_name: "GPT-6.1 Terra (Azure)" }
        - { provider: azure-openai, model: "gpt-6.2-astra", display_name: "GPT-6.2 Astra (Azure)" }
        - { provider: azure-openai, model: "gpt-6.2-sol", display_name: "GPT-6.2 Sol (Azure)" }

  - version: "2.12.0"
    date: "2026-11-26"
    description: "Follow-up to 2.11.0: 25 models added. New routes on Fireworks (DeepSeek V4.1 Flash 1017 Flex and US, Kimi K3.1 Pro US, Kimi Latest, Ultramarine 1 Flash, Qwen4 Max, Hy4 flash), Hugging Face (Mistral Large 4, Beam 1.0, Nemotron 3.5 Super VL in two builds, Muse Spark Open, Inkling 2 Mini), Together (Glimpse 1.0, DeepSeek V4.1 Flash 1017 Fast, Ripple 65B Preview), Alibaba (Kimi K3.1 Pro and Pro Prime), Z.ai (GLM-5.3-FlashX-Legal) and OpenRouter (Xiaomi MiMo-V2.6-Flash-MOPD, Upstage Solar Mini 4.5 Preview). On Amazon Bedrock, Kimi K3.1 Pro Highspeed is added through its US and Global inference profiles, with prices checked against the AWS pricing page, and the US and Global profiles of Claude Fable 5.2 get their own entries so requests to those ids are priced: Global at the first-party rate and US at 10 percent above it, following Anthropic's published rule for regional endpoints (the AWS page did not show Anthropic prices to confirm). They carry the same request-setting exclusions as the base model. Prices and limits for the Fireworks, Hugging Face, Together, Alibaba and Z.ai entries come from models.dev as of 2026-11-26 and were not checked against each provider's own page. OpenRouter dates indicate route listing, not necessarily original model launch."
