  - version: "2.11.0"
    date: "2026-11-24"
    description: "Refresh for September 30 to November 24, 2026: 232 models added. New first-party models include GPT-6.1 Sol, GPT-6.1 Terra, GPT-6.2 Sol and GPT-6.2 Astra, Claude Fable 5.2 and Claude Haiku 5.5 (also on Amazon Bedrock and Vertex AI), Gemini 4 Argon, Carbon, Hydrogen and Neon, Mistral Large 4, Kimi K3.1 Pro, MiniMax-M3.1-Flash, Qwen4 Max and Qwen3.8 Flash, and GLM-5.3 Flash and FlashX, plus new routes on OpenRouter, Fireworks, Together, Hugging Face, NVIDIA NIM, Groq and Cerebras. Adds eight providers with 123 models between them: DeepInfra (25), Novita (25), Nebius (23), Chutes (20), Baseten (15), Meta Muse (7), SambaNova (4) and Tencent Hy (4). Models that reject certain request settings now say so, and the gateway leaves those settings out of the request: temperature and top_p for GPT-6.2 Sol and Astra; temperature, top_p, top_k and manual thinking budgets for Claude Haiku 5.5 and Claude Fable 5.2 (Fable 5.2 also ignores an explicit thinking on or off switch, since its thinking is always on); and the thinking switch for MiniMax-M3.1-Flash. Prices are corrected for Claude Sonnet 5.5 cache reads, DeepSeek V4 Pro, Qwen3.7 Plus and MiniMax-M3 long prompts, and mistral-large-latest now points to Mistral Large 4. 22 models their providers have already shut down or removed are marked deprecated. 32 more that their providers plan to retire stay selectable with their current status, because they can still be called. Both groups carry the provider's dates and replacement in their notes. Models on the eight new providers accept text input only through Everstack for now. Gemini 4 Argon and Carbon show their introductory prices, which double on December 1, 2026. OpenRouter dates indicate route listing, not necessarily original model launch. See research/2026-11-24.md for sources, coverage, and exclusions."
    changes:
      new_models:
        - { provider: anthropic, model: "claude-fable-5-2", display_name: "Claude Fable 5.2" }
