  - version: "2.6.0"
    date: "2026-08-25"
    description: "Adds Z.AI as a direct provider, carrying the full GLM inventory of 15 models including GLM-5.3, GLM-5.2 and the GLM-4.7 line. GLM was previously reachable only by reselling through Fireworks, Together, OpenRouter or NVIDIA NIM, each of which adds a markup and its own rate limits. Z.AI is carried by 6 of the 17 competitor gateways surveyed in docs/design/provider-catalog-expansion.md, the widest coverage of any provider Everstack did not integrate directly. Its model list is consolidated under 2.7.0: all three releases publish on the same merge, and the catalog loader marks models as new only for the release matching version.txt, so a list left here would never reach the UI."
    changes:
      new_models: []

  - version: "2.5.0"
    date: "2026-08-25"
    description: "Full reconciliation of every provider catalog against models.dev: 111 models added and 224 existing models reconciled against upstream pricing, context and completion limits, capabilities, and modalities. The catalog grows from 459 to 570 models. 40 of the additions were released since 2.4.0 and are listed below so they receive a new marker; the remaining 71 are backfills of models that already existed and are deliberately left unmarked. New arrivals include Grok 4.6, Gemini 3.7 Flash, GLM 5.3, Qwen 3.8 (Max, 27B, 2.4T-A95B), DeepSeek V4 Pro 0813 and V4 Flash 0731, Kimi K3, Nemotron 3.5 Lightning, Muse Glimmer and Muse Spark, Seed 2.1 Turbo, Solar Pro 4, and Hunyuan MT2. Models absent from the upstream text-generation feed were left untouched rather than deprecated, because this catalog also carries dated snapshot ids and non-text products that feed never lists. Its model list is consolidated under 2.7.0: all three releases publish on the same merge, and the catalog loader marks models as new only for the release matching version.txt, so a list left here would never reach the UI."
    changes:
      new_models: []
