name: "claude-opus-4-latest"
display_name: "Claude Opus 4 (Latest)"
family: "claude-4"
status: "stable"

cost:
  input_per_1k: 0.005
  output_per_1k: 0.025

limits:
  max_tokens: 1000000
  max_completion_tokens: 128000

capabilities:
  - chat
  - function_calling
  - vision
  - extended_thinking
  - computer_use

modalities:
  input: ["text", "image", "pdf"]
  output: ["text"]

notes: "Alias that always points to the latest Claude Opus 4.x version (currently Claude Opus 4.7)"

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 128000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
