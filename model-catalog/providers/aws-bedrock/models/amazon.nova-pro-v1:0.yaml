name: "amazon.nova-pro-v1:0"
display_name: "Amazon Nova Pro"
family: "nova"
status: "stable"
release_date: "2024-12-03"

cost:
  input_per_1k: 0.0008
  output_per_1k: 0.0032
  cache_read_per_1k: 0.0002

limits:
  max_tokens: 300000
  max_completion_tokens: 8192

capabilities:
  - chat
  - function_calling
  - vision

modalities:
  input: ["text","image","video"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 8192
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
