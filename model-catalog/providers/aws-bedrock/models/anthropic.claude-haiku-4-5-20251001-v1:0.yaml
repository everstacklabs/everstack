name: "anthropic.claude-haiku-4-5-20251001-v1:0"
display_name: "Claude Haiku 4.5 (Bedrock)"
family: "claude-4"
status: "stable"
release_date: "2025-10-15"

cost:
  input_per_1k: 0.001
  output_per_1k: 0.005
  cache_read_per_1k: 0.0001
  cache_write_per_1k: 0.00125

limits:
  max_tokens: 200000
  max_completion_tokens: 64000

capabilities:
  - chat
  - function_calling
  - vision
  - extended_thinking

modalities:
  input: ["text","image","pdf"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 64000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
