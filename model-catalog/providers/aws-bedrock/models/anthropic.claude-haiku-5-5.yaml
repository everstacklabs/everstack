name: "anthropic.claude-haiku-5-5"
display_name: "Claude Haiku 5.5 (Bedrock)"
family: "claude-haiku"
status: "stable"
release_date: "2026-10-07"

cost:
  input_per_1k: 0.00011
  output_per_1k: 0.00055
  cache_read_per_1k: 0.000011
  cache_write_per_1k: 0.0001375

limits:
  max_tokens: 1000000
  max_completion_tokens: 128000

capabilities:
  - chat
  - function_calling
  - vision
  - extended_thinking

modalities:
  input: ["text","image","pdf"]
  output: ["text"]

knowledge_cutoff: "2026-06"
notes: "Fast Claude model for responsive assistance, classification, and lightweight agents"
unsupported_parameters:
  - "temperature"
  - "top_p"
  - "top_k"
  - "thinking_budget"
structured_output: false
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 128000
    has_max_value: true
added_in_version: "2.11.0"
