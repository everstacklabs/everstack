name: "anthropic.claude-opus-5"
display_name: "Claude Opus 5 (Bedrock)"
family: "claude-opus"
status: "stable"
release_date: "2026-07-24"

cost:
  input_per_1k: 0.005
  output_per_1k: 0.025
  cache_read_per_1k: 0.0005
  cache_write_per_1k: 0.00625

limits:
  max_tokens: 1000000
  max_completion_tokens: 128000

capabilities:
  - chat
  - function_calling
  - vision
  - extended_thinking

modalities:
  input: ["text","image","pdf"]
  output: ["text"]

knowledge_cutoff: "2026-05"
notes: "Strongest Claude Opus model for coding, agents, and professional work"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 128000
    has_max_value: true
