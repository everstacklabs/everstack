name: "meta.llama3-1-70b-instruct-v1:0"
display_name: "Llama 3.1 70B Instruct"
family: "llama"
status: "stable"
release_date: "2024-07-23"

cost:
  input_per_1k: 0.00072
  output_per_1k: 0.00072

limits:
  max_tokens: 128000
  max_completion_tokens: 4096

capabilities:
  - chat
  - function_calling

modalities:
  input: ["text"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 4096
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
