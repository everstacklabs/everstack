name: "xai.grok-4.6"
display_name: "Grok 4.6 (Bedrock)"
family: "grok"
status: "stable"
release_date: "2026-08-12"

cost:
  input_per_1k: 0.0022
  output_per_1k: 0.0066
  cache_read_per_1k: 0.00055

limits:
  max_tokens: 500000
  max_completion_tokens: 500000

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]

knowledge_cutoff: "2026-02-01"
notes: "xAI's frontier model for long-running agents, coding, knowledge work, and visual projects"

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 500000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
