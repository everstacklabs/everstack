# Copied from the first-party entry; Azure lists the same model at the same list price on models.dev (2026-11-26).
# Not checked against Azure's own pricing page, which renders prices client-side.
name: "claude-haiku-5-5"
display_name: "Claude Haiku 5.5 (Azure)"
family: "claude-haiku"
status: "stable"
release_date: "2026-10-07"
api_type: "anthropic"
cost:
  input_per_1k: 0.0001
  output_per_1k: 0.0005
  cache_read_per_1k: 1.0e-05
  cache_write_per_1k: 0.000125
  cache_write_1h_per_1k: 0.0002
  long_context:
    threshold_tokens: 100000
    input_multiplier: 5
    cache_multiplier: 5
    output_multiplier: 5
limits:
  max_tokens: 1000000
  max_completion_tokens: 128000
capabilities:
  - "chat"
  - "function_calling"
  - "vision"
  - "extended_thinking"
  - "computer_use"
modalities:
  input:
    - "text"
    - "image"
    - "pdf"
  output:
    - "text"
knowledge_cutoff: "2026-06"
notes: "Prompts over 100,000 tokens (counting cache reads and writes) bill the whole request at 5x every rate. Adaptive thinking on by default; default effort medium; thinking can be disabled only at high effort or below. Manual budget_tokens thinking, assistant prefill and temperature, top_p or top_k return errors. Standard synchronous output limit; batch beta limits are separate. On Azure this model is served by the Foundry Messages API; the deployment must be named after the model id."
unsupported_parameters:
  - "temperature"
  - "top_p"
  - "top_k"
  - "thinking_budget"
parameters:
  -
    key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 128000
    has_max_value: true
  -
    key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options:
      - "low"
      - "medium"
      - "high"
      - "xhigh"
      - "max"
variants:
  -
    id: "low"
    display_name: "Low reasoning"
    description: "Lower latency and cost for straightforward tasks."
    parameters:
      reasoning_effort: "low"
  -
    id: "medium"
    display_name: "Medium reasoning"
    description: "Balanced reasoning for general-purpose work."
    parameters:
      reasoning_effort: "medium"
  -
    id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
  -
    id: "xhigh"
    display_name: "Extra-high reasoning"
    description: "Extended reasoning for long-horizon agentic work."
    parameters:
      reasoning_effort: "xhigh"
  -
    id: "max"
    display_name: "Maximum reasoning"
    description: "Maximum available reasoning depth for the model."
    parameters:
      reasoning_effort: "max"
added_in_version: "2.13.0"
