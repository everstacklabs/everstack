name: "gpt-4o"
display_name: "GPT-4o"
family: "gpt-4o"
status: "deprecated"
release_date: "2024-05-13"

cost:
  input_per_1k: 0.0025
  output_per_1k: 0.01
  cache_read_per_1k: 0.00125

limits:
  max_tokens: 128000
  max_completion_tokens: 16384

capabilities:
  - chat
  - function_calling
  - vision

modalities:
  input: ["text","image"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 16384
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
