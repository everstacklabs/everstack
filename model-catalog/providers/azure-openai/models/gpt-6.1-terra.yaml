# Copied from the first-party entry; Azure lists the same model at the same list price on models.dev (2026-11-26).
# Not checked against Azure's own pricing page, which renders prices client-side.
name: "gpt-6.1-terra"
display_name: "GPT-6.1 Terra (Azure)"
family: "gpt-6"
status: "stable"
release_date: "2026-10-26"
api_type: "responses"
cost:
  input_per_1k: 0.001
  output_per_1k: 0.005
  cache_read_per_1k: 0.00005
  cache_write_per_1k: 0.00125
  long_context:
    threshold_tokens: 272000
    input_multiplier: 2
    cache_multiplier: 2
    output_multiplier: 1.5
limits:
  max_tokens: 1050000
  max_completion_tokens: 128000
capabilities:
  - "chat"
  - "function_calling"
  - "vision"
  - "reasoning"
  - "computer_use"
  - "coding"
modalities:
  input:
    - "text"
    - "image"
  output:
    - "text"
knowledge_cutoff: "2026-06-01"
notes: "Fast, efficient model for visual reasoning, computer use, and writing. Tool calling requires the Responses API. Default reasoning effort medium. Cache write price is the 30-minute retention rate; 12-hour cache writes cost 0.0025 per 1K. Prompts over 272K input tokens bill the whole request at 2x input and cache rates and 1.5x output. On Azure this model is served by the v1 Responses API; the deployment must be named after the model id."
structured_output: true
parameters:
  -
    key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 128000
    has_max_value: true
  -
    key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options:
      - "none"
      - "low"
      - "medium"
      - "high"
      - "xhigh"
      - "max"
variants:
  -
    id: "none"
    display_name: "None reasoning"
    parameters:
      reasoning_effort: "none"
  -
    id: "low"
    display_name: "Low reasoning"
    parameters:
      reasoning_effort: "low"
  -
    id: "medium"
    display_name: "Medium reasoning"
    parameters:
      reasoning_effort: "medium"
  -
    id: "high"
    display_name: "High reasoning"
    parameters:
      reasoning_effort: "high"
  -
    id: "xhigh"
    display_name: "Xhigh reasoning"
    parameters:
      reasoning_effort: "xhigh"
  -
    id: "max"
    display_name: "Max reasoning"
    parameters:
      reasoning_effort: "max"
added_in_version: "2.13.0"
