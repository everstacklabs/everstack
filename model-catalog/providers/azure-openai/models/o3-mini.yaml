name: "o3-mini"
display_name: "o3-mini"
family: "o-series"
status: "deprecated"
release_date: "2024-12-20"

cost:
  input_per_1k: 0.0011
  output_per_1k: 0.0044
  cache_read_per_1k: 0.00055

limits:
  max_tokens: 200000
  max_completion_tokens: 100000

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 100000
    has_max_value: true
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["low","medium","high"]
variants:
  - id: "low"
    display_name: "Low reasoning"
    description: "Lower latency and cost for straightforward tasks."
    parameters:
      reasoning_effort: "low"
  - id: "medium"
    display_name: "Medium reasoning"
    description: "Balanced reasoning for general-purpose work."
    parameters:
      reasoning_effort: "medium"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
