name: "moonshotai/Kimi-K3.1-Pro"
display_name: "Kimi K3.1 Pro (Baseten)"
family: "kimi-pro"
status: "stable"
release_date: "2026-10-23"

cost:
  input_per_1k: 0.002
  output_per_1k: 0.01
  cache_read_per_1k: 0.0002

limits:
  max_tokens: 1048576
  max_completion_tokens: 262144

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]
notes: "Multimodal Kimi model with a 1M-token context window and always-on reasoning, for coding, 3D creation and financial research"

structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 262144
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
