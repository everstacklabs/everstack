    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 262144
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
