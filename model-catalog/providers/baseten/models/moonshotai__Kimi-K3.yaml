name: "moonshotai/Kimi-K3"
display_name: "Kimi K3 (Baseten)"
family: "kimi"
status: "stable"
release_date: "2026-07-16"

cost:
  input_per_1k: 0.003
  output_per_1k: 0.015
  cache_read_per_1k: 0.0003

limits:
  max_tokens: 1048576
  max_completion_tokens: 262144

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]
notes: "Kimi multimodal agent model for visual understanding, coding, and planning"

structured_output: true
parameters:
