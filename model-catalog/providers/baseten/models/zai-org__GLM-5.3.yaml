name: "zai-org/GLM-5.3"
display_name: "GLM 5.3 (Baseten)"
family: "glm"
status: "stable"
release_date: "2026-08-14"

cost:
  input_per_1k: 0.0014
  output_per_1k: 0.0044
  cache_read_per_1k: 0.00014

limits:
  max_tokens: 1048576
  max_completion_tokens: 262144

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]
notes: "Flagship GLM model for hybrid reasoning, coding, and agentic engineering"

structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 262144
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
