name: "chutes"
display_name: "Chutes"
base_url: "https://llm.chutes.ai/v1"
api_version: "2024-01-01"

provider_type: "meta"
supports_model_discovery: false

auth:
  type: "api_key"
  header_name: "Authorization"
  header_format: "Bearer {api_key}"
  env_var: "CHUTES_API_KEY"

rate_limits:
  requests_per_minute: 1200
  tokens_per_minute: 240000
  concurrent_requests: 30

capabilities:
  chat: true
  completions: false
  embeddings: false
  function_calling: true
  vision: false
  streaming: true
  fine_tuning: false
  assistants: false

model_families:
  qwen:
    description: "Qwen family on Chutes, including TEE variants"
    capabilities: ["chat", "function_calling", "reasoning"]
  deepseek:
    description: "DeepSeek family on Chutes"
    capabilities: ["chat", "function_calling", "reasoning"]
  glm:
    description: "GLM family on Chutes"
    capabilities: ["chat", "function_calling", "reasoning"]
  kimi:
    description: "Kimi family on Chutes"
    capabilities: ["chat", "function_calling", "reasoning"]
