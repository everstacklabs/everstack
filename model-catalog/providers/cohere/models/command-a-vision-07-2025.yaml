name: "command-a-vision-07-2025"
display_name: "Command A Vision"
family: "command-a"
status: "stable"
release_date: "2025-07-31"

cost:
  input_per_1k: 0.0025
  output_per_1k: 0.01

limits:
  max_tokens: 128000
  max_completion_tokens: 8000

capabilities:
  - chat
  - vision

modalities:
  input: ["text","image"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 8000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
