name: "command-r-08-2024"
display_name: "Command R"
family: "command-r"
status: "stable"
release_date: "2024-08-30"

cost:
  input_per_1k: 0.00015
  output_per_1k: 0.0006

limits:
  max_tokens: 128000
  max_completion_tokens: 4000

capabilities:
  - chat
  - function_calling

modalities:
  input: ["text"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 4000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
