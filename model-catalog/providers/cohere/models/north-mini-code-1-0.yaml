name: "north-mini-code-1-0"
display_name: "North Mini Code"
family: "north"
status: "stable"
release_date: "2026-06-09"

cost:
  input_per_1k: 0
  output_per_1k: 0

limits:
  max_tokens: 256000
  max_completion_tokens: 64000

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2025-09-23"
notes: "Cohere coding model for practical software engineering and agentic edits"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 64000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["none","high"]
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
variants:
  - id: "none"
    display_name: "No reasoning"
    description: "Fastest response with reasoning disabled when the model permits it."
    parameters:
      reasoning_effort: "none"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
