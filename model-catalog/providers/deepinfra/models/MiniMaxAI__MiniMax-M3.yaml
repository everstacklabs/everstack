name: "MiniMaxAI/MiniMax-M3"
display_name: "MiniMax-M3 (DeepInfra)"
family: "minimax-m"
status: "stable"
release_date: "2026-06-01"

cost:
  input_per_1k: 0.00028
  output_per_1k: 0.0011
  cache_read_per_1k: 0.000056

limits:
  max_tokens: 524288
  max_completion_tokens: 512000

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]
notes: "MiniMax multimodal model for long-context coding, perception, and agent planning"

structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 512000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
