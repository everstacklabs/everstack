name: "meta-llama/Llama-3.3-70B-Instruct-Turbo"
display_name: "Llama 3.3 70B Turbo (DeepInfra)"
family: "llama"
status: "stable"
release_date: "2024-12-06"

cost:
  input_per_1k: 0.0001
  output_per_1k: 0.00032

limits:
  max_tokens: 131072
  max_completion_tokens: 16384

capabilities:
  - chat
  - function_calling

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2023-12"
notes: "Compact Llama instruction model for fast chat and local deployment"

structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 16384
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
