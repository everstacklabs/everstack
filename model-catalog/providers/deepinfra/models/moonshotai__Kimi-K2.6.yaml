name: "moonshotai/Kimi-K2.6"
display_name: "Kimi K2.6 (DeepInfra)"
family: "kimi"
status: "stable"
release_date: "2026-04-20"

cost:
  input_per_1k: 0.00075
  output_per_1k: 0.0035
  cache_read_per_1k: 0.00015

limits:
  max_tokens: 262144
  max_completion_tokens: 16384

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2025-01"
notes: "Kimi multimodal agent model for visual understanding, coding, and planning"

structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 16384
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
