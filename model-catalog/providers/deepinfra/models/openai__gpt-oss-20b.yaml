# Verified 2026-11-24.
# Source: https://api.deepinfra.com/v1/openai/models
name: "openai/gpt-oss-20b"
display_name: "GPT OSS 20B (DeepInfra)"
family: "gpt-oss"
status: "stable"
release_date: "2025-08-05"

cost:
  input_per_1k: 0.00003
  output_per_1k: 0.00014
  cache_read_per_1k: 0.000015

limits:
  max_tokens: 131072
  max_completion_tokens: 16384

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2024-06"
notes: "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 16384
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
