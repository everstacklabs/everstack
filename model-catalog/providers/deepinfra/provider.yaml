name: "deepinfra"
display_name: "DeepInfra"
base_url: "https://api.deepinfra.com/v1/openai"
api_version: "2024-01-01"

provider_type: "meta"
supports_model_discovery: false

auth:
  type: "api_key"
  header_name: "Authorization"
  header_format: "Bearer {api_key}"
  env_var: "DEEPINFRA_API_KEY"

rate_limits:
  requests_per_minute: 1200
  tokens_per_minute: 240000
  concurrent_requests: 30

capabilities:
  chat: true
  completions: false
  embeddings: false
  function_calling: true
  vision: false
  streaming: true
  fine_tuning: false
  assistants: false

model_families:
  deepseek:
    description: "DeepSeek V4 family via DeepInfra"
    capabilities: ["chat", "function_calling", "reasoning"]
  qwen:
    description: "Qwen family via DeepInfra"
    capabilities: ["chat", "function_calling", "reasoning"]
  glm:
    description: "GLM family via DeepInfra"
    capabilities: ["chat", "function_calling", "reasoning"]
  kimi:
    description: "Kimi family via DeepInfra"
    capabilities: ["chat", "function_calling", "reasoning"]
