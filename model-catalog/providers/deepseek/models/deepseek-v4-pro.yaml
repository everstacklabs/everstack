# Verified 2026-11-24.
# Source: https://api-docs.deepseek.com/quick_start/pricing
name: "deepseek-v4-pro"
display_name: "DeepSeek V4 Pro"
family: "deepseek-v4"
status: "stable"
release_date: "2026-08-12"

cost:
  input_per_1k: 0.00132
  output_per_1k: 0.00396
  cache_read_per_1k: 4.4e-05

limits:
  max_tokens: 1000000
  max_completion_tokens: 384000

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]
notes: "Serves DeepSeek-V4-Pro-0813. Peak rates. Off-peak rates are 50% lower. Peak UTC hours: 01:00-04:00 and 06:00-10:00 on weekdays excluding Chinese public holidays."
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 384000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["high","max"]
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
variants:
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
  - id: "max"
    display_name: "Maximum reasoning"
    description: "Maximum available reasoning depth for the model."
    parameters:
      reasoning_effort: "max"
