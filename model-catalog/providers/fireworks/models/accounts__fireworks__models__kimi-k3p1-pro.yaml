name: "accounts/fireworks/models/kimi-k3p1-pro"
display_name: "Kimi K3.1 Pro (Fireworks)"
family: "kimi-pro"
status: "stable"
release_date: "2026-10-23"

cost:
  input_per_1k: 0.002
  output_per_1k: 0.01
  cache_read_per_1k: 0.0002

limits:
  max_tokens: 1048576
  max_completion_tokens: 1048576

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]
notes: "Multimodal Kimi model with a 1M-token context window and always-on reasoning, for coding, 3D creation and financial research"
structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 1048576
    has_max_value: true
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["low","medium","high","max"]
variants:
  - id: "low"
    display_name: "Low reasoning"
    description: "Lower latency and cost for straightforward tasks."
    parameters:
      reasoning_effort: "low"
  - id: "medium"
    display_name: "Medium reasoning"
    description: "Balanced reasoning for general-purpose work."
    parameters:
      reasoning_effort: "medium"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
  - id: "max"
    display_name: "Maximum reasoning"
    description: "Maximum available reasoning depth for the model."
    parameters:
      reasoning_effort: "max"
added_in_version: "2.11.0"
