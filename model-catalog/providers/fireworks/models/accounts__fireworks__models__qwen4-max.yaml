name: "accounts/fireworks/models/qwen4-max"
display_name: "Qwen4 Max (Fireworks)"
family: "qwen-max"
status: "stable"
release_date: "2026-11-16"

cost:
  input_per_1k: 0.0015
  output_per_1k: 0.0045
  cache_read_per_1k: 0.000075

limits:
  max_tokens: 262144
  max_completion_tokens: 262144

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]
notes: "Flagship multimodal model for coding, office productivity, frontend design, and complex agentic tasks"
structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 262144
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["none","low","high","xhigh"]
variants:
  - id: "none"
    display_name: "No reasoning"
    description: "Fastest response with reasoning disabled when the model permits it."
    parameters:
      reasoning_effort: "none"
  - id: "low"
    display_name: "Low reasoning"
    description: "Lower latency and cost for straightforward tasks."
    parameters:
      reasoning_effort: "low"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
  - id: "xhigh"
    display_name: "Extra-high reasoning"
    description: "Extended reasoning for long-horizon agentic work."
    parameters:
      reasoning_effort: "xhigh"
added_in_version: "2.12.0"
