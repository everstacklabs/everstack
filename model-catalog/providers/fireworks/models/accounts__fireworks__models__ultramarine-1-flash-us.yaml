name: "accounts/fireworks/models/ultramarine-1-flash-us"
display_name: "Ultramarine 1 Flash (Fireworks)"
family: "ultramarine"
status: "stable"
release_date: "2026-11-12"

cost:
  input_per_1k: 0.00015
  output_per_1k: 0.0005
  cache_read_per_1k: 0.00003

limits:
  max_tokens: 1048576
  max_completion_tokens: 131072

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]
notes: "Paper Instruments' agentic model for professional knowledge work, RL-trained on GLM-5.3 Flash"
structured_output: false
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 131072
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["low","high","max"]
variants:
  - id: "low"
    display_name: "Low reasoning"
    description: "Lower latency and cost for straightforward tasks."
    parameters:
      reasoning_effort: "low"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
  - id: "max"
    display_name: "Maximum reasoning"
    description: "Maximum available reasoning depth for the model."
    parameters:
      reasoning_effort: "max"
added_in_version: "2.12.0"
