name: gemini-2.0-flash
display_name: Gemini 2.0 Flash
family: gemini
status: stable
release_date: "2024-12-11"

cost:
  input_per_1k: 0.0001
  output_per_1k: 0.0004
  cache_read_per_1k: 0.000025

limits:
  max_tokens: 1048576
  max_completion_tokens: 8192

capabilities:
  - chat
  - vision
  - function_calling

modalities:
  input: [text, image, audio, video]
  output: [text]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 8192
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
