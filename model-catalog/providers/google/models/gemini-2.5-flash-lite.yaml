name: "gemini-2.5-flash-lite"
display_name: "Gemini 2.5 Flash Lite"
family: "gemini"
status: "stable"
release_date: "2025-06-17"

cost:
  input_per_1k: 0.0001
  output_per_1k: 0.0004
  cache_read_per_1k: 0.00001

limits:
  max_tokens: 1048576
  max_completion_tokens: 65536

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image","audio","video","pdf"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 65536
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_enabled"
    display_name: "Reasoning"
    type: "boolean"
  - key: "reasoning_budget_tokens"
    display_name: "Reasoning token budget"
    type: "integer"
    min_value: 512
    has_min_value: true
    max_value: 24576
    has_max_value: true
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
