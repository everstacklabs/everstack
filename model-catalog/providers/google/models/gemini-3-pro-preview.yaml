name: "gemini-3-pro-preview"
display_name: "Gemini 3 Pro (Preview)"
family: "gemini-3"
status: "preview"
release_date: "2025-11-18"

cost:
  input_per_1k: 0.002
  output_per_1k: 0.012
  cache_read_per_1k: 0.0002

limits:
  max_tokens: 1000000
  max_completion_tokens: 64000

capabilities:
  - chat
  - vision
  - function_calling
  - reasoning

modalities:
  input: ["text", "image", "video", "audio", "pdf"]
  output: ["text"]

notes: "Pricing doubles for context > 200K tokens"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 65536
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["low","high"]
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
variants:
  - id: "low"
    display_name: "Low reasoning"
    description: "Lower latency and cost for straightforward tasks."
    parameters:
      reasoning_effort: "low"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
