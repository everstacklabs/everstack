name: "gemini-4-hydrogen"
display_name: "Gemini 4 Hydrogen"
family: "gemini-4"
status: "stable"
release_date: "2026-11-12"
cost:
  input_per_1k: 0.0015
  output_per_1k: 0.0075
  cache_read_per_1k: 7.5e-05
limits:
  max_tokens: 1048576
  max_completion_tokens: 65536
capabilities:
  - "chat"
  - "function_calling"
  - "vision"
  - "reasoning"
  - "computer_use"
  - "coding"
modalities:
  input:
    - "text"
    - "image"
    - "video"
    - "audio"
    - "pdf"
  output:
    - "text"
notes: "Standard paid token rates; a free tier is also available. Implicit context caching only; explicit caching is unsupported. Default output limit 65,536 tokens; long decode allows more."
parameters:
  -
    key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 65536
    has_max_value: true
  -
    key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options:
      - "low"
      - "medium"
      - "high"
      - "xhigh"
structured_output: true
variants:
  -
    id: "low"
    display_name: "Low reasoning"
    parameters:
      reasoning_effort: "low"
  -
    id: "medium"
    display_name: "Medium reasoning"
    parameters:
      reasoning_effort: "medium"
  -
    id: "high"
    display_name: "High reasoning"
    parameters:
      reasoning_effort: "high"
  -
    id: "xhigh"
    display_name: "Xhigh reasoning"
    parameters:
      reasoning_effort: "xhigh"
added_in_version: "2.11.0"
