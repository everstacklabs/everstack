name: "groq/compound-mini"
display_name: "Compound Mini"
family: "groq"
status: "stable"
release_date: "2025-09-04"

cost:
  input_per_1k: 0
  output_per_1k: 0

limits:
  max_tokens: 131072
  max_completion_tokens: 8192

capabilities:
  - chat

modalities:
  input: ["text"]
  output: ["text"]

notes: "Efficient model for low-latency assistance, extraction, and routine automation"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 8192
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
