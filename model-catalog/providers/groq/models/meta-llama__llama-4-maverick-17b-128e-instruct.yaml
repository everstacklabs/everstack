name: "meta-llama/llama-4-maverick-17b-128e-instruct"
display_name: "Llama 4 Maverick 17B 128E (Groq)"
family: "llama"
status: "stable"

cost:
  input_per_1k: 0.0002
  output_per_1k: 0.0006

limits:
  max_tokens: 131072
  max_completion_tokens: 8192

capabilities:
  - chat
  - function_calling

modalities:
  input: ["text"]
  output: ["text"]

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 8192
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
