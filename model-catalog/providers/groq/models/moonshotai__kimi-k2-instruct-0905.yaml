name: "moonshotai/kimi-k2-instruct-0905"
display_name: "Kimi K2 Instruct 0905 (Groq)"
family: "kimi"
status: "stable"

cost:
  input_per_1k: 0.001
  output_per_1k: 0.003

limits:
  max_tokens: 262144
  max_completion_tokens: 16384

capabilities:
  - chat
  - function_calling

modalities:
  input: ["text"]
  output: ["text"]

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 16384
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
