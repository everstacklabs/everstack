# Verified 2026-11-24.
# Source: https://console.groq.com/docs/model/qwen/qwen3.8-27b
# Release date from models.dev (groq entry); the provider's pages do not state one.
name: "qwen/qwen3.8-27b"
display_name: "Qwen3.8 27B"
family: "qwen"
status: "preview"
release_date: "2026-08-14"

cost:
  input_per_1k: 0.0008
  output_per_1k: 0.004

limits:
  max_tokens: 131072
  max_completion_tokens: 16384

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]

notes: "Preview on Groq; replaced qwen/qwen3.6-27b. Up to 3 images per request (each counts as 2048 input tokens). reasoning_effort default enables thinking, none gives instruct mode, low/medium/high tune depth; reasoning_format hidden or parsed."

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 16384
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["none","default","low","medium","high"]
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
added_in_version: "2.11.0"
