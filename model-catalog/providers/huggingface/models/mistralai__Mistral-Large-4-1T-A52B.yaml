name: "mistralai/Mistral-Large-4-1T-A52B"
display_name: "Mistral Large 4 (Hugging Face)"
family: "mistral-large"
status: "stable"
release_date: "2026-10-05"

cost:
  input_per_1k: 0.0007
  output_per_1k: 0.0021

limits:
  max_tokens: 1048576
  max_completion_tokens: 262144

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]
notes: "Mistral's 1T-parameter multimodal MoE for reasoning, coding, and agentic work"
structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 262144
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["low","medium","high"]
variants:
  - id: "low"
    display_name: "Low reasoning"
    description: "Lower latency and cost for straightforward tasks."
    parameters:
      reasoning_effort: "low"
  - id: "medium"
    display_name: "Medium reasoning"
    description: "Balanced reasoning for general-purpose work."
    parameters:
      reasoning_effort: "medium"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
added_in_version: "2.12.0"
