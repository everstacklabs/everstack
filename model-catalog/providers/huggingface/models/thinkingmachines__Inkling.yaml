name: "thinkingmachines/Inkling"
display_name: "Inkling (Hugging Face)"
family: "ling"
status: "stable"
release_date: "2026-07-15"

cost:
  input_per_1k: 0.001
  output_per_1k: 0.00405

limits:
  max_tokens: 1048576
  max_completion_tokens: 1048576

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]

notes: "Multimodal model for analyzing text, images, documents, and rich media"

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 1048576
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
