# Verified 2026-11-24.
# Source: https://platform.minimax.io/docs/guides/pricing-paygo
# Source: https://platform.minimax.io/docs/guides/text-generation
# Source: https://platform.minimax.io/docs/release-notes/models
name: "MiniMax-M3.1-Flash"
display_name: "MiniMax-M3.1-Flash"
family: "minimax"
status: "stable"
release_date: "2026-10-19"

cost:
  input_per_1k: 0.00015
  output_per_1k: 0.0006
  cache_read_per_1k: 1.5e-05

limits:
  max_tokens: 1000000

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning
  - coding

modalities:
  input: ["text","image","video"]
  output: ["text"]

notes: "Open-weight multimodal coding model with 1M context. Thinking is always on: effort (reasoning_effort on the OpenAI-compatible API) accepts low, medium, high, xhigh or max, default max; disabled thinking or effort none returns HTTP 400. MiniMax does not publish a maximum output length or a cache write price."
unsupported_parameters:
  - "thinking_toggle"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["low","medium","high","xhigh","max"]
variants:
  - id: "low"
    display_name: "Low reasoning"
    description: "Lower latency and cost for straightforward tasks."
    parameters:
      reasoning_effort: "low"
  - id: "medium"
    display_name: "Medium reasoning"
    description: "Balanced reasoning for general-purpose work."
    parameters:
      reasoning_effort: "medium"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
  - id: "xhigh"
    display_name: "Extra-high reasoning"
    description: "Extended reasoning for long-horizon agentic work."
    parameters:
      reasoning_effort: "xhigh"
  - id: "max"
    display_name: "Maximum reasoning"
    description: "Maximum available reasoning depth for the model."
    parameters:
      reasoning_effort: "max"
added_in_version: "2.11.0"
