name: "magistral-medium-latest"
display_name: "Magistral Medium (Latest)"
family: "magistral"
status: "stable"
release_date: "2025-03-17"

cost:
  input_per_1k: 0.002
  output_per_1k: 0.005

limits:
  max_tokens: 128000
  max_completion_tokens: 16384

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 16384
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
