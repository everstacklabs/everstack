name: "magistral-small"
display_name: "Magistral Small"
family: "magistral-small"
status: "stable"
release_date: "2025-03-17"

cost:
  input_per_1k: 0.0005
  output_per_1k: 0.0015

limits:
  max_tokens: 128000
  max_completion_tokens: 128000

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2025-06"
notes: "Mistral reasoning model for transparent analysis, math, and complex decisions"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 128000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
