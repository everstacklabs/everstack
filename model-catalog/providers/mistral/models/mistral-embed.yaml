name: "mistral-embed"
display_name: "Mistral Embed"
family: "embedding"
status: "stable"
release_date: "2023-12-11"

cost:
  input_per_1k: 0.0001
  output_per_1k: 0

limits:
  max_tokens: 8000
  max_completion_tokens: 3072

capabilities:
  - chat

modalities:
  input: ["text"]
  output: ["text"]
parameters:
