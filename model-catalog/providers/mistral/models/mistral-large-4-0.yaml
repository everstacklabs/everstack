# Verified 2026-11-24.
# Source: https://docs.mistral.ai/models/mistral-large-4-0
# Source: https://docs.mistral.ai/resources/changelogs
name: "mistral-large-4-0"
display_name: "Mistral Large 4 (26.10)"
family: "mistral-large"
status: "stable"
release_date: "2026-11-05"

cost:
  input_per_1k: 0.0007
  output_per_1k: 0.0021
  cache_read_per_1k: 7.0e-05

limits:
  max_tokens: 1048576

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]

notes: "Mistral Large 4 (26.10), open-weight multimodal model; GA 2026-11-05 after a public preview from 2026-10-06. Always reasons: reasoning_effort low, medium or high (default high); reasoning_effort none returns HTTP 400 since 2026-10-29. Mistral does not publish a separate output cap."
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["low","medium","high"]
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
variants:
  - id: "low"
    display_name: "Low reasoning"
    description: "Least reasoning; Mistral Large 4 always reasons."
    parameters:
      reasoning_effort: "low"
  - id: "medium"
    display_name: "Medium reasoning"
    description: "Balanced reasoning for general-purpose work."
    parameters:
      reasoning_effort: "medium"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
added_in_version: "2.11.0"
