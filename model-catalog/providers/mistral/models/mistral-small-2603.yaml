name: "mistral-small-2603"
display_name: "Mistral Small 4"
family: "mistral-small"
status: "stable"
release_date: "2026-03-16"

cost:
  input_per_1k: 0.00015
  output_per_1k: 0.0006

limits:
  max_tokens: 256000
  max_completion_tokens: 256000

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]

knowledge_cutoff: "2025-06"
notes: "Fast Mistral production model for chat, extraction, and cost-sensitive agents"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 256000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["none","high"]
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
variants:
  - id: "none"
    display_name: "No reasoning"
    description: "Fastest response with reasoning disabled when the model permits it."
    parameters:
      reasoning_effort: "none"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
