name: "open-mixtral-8x22b"
display_name: "Mixtral 8x22B"
family: "mixtral"
status: "stable"
release_date: "2024-04-17"

cost:
  input_per_1k: 0.002
  output_per_1k: 0.006

limits:
  max_tokens: 64000
  max_completion_tokens: 64000

capabilities:
  - chat
  - function_calling

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2024-04"
notes: "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 64000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
