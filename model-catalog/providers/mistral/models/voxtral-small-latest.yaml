name: "voxtral-small-latest"
display_name: "Voxtral Small (latest)"
family: "voxtral"
status: "stable"
release_date: "2025-07-15"

cost:
  input_per_1k: 0.0001
  output_per_1k: 0.0003

limits:
  max_tokens: 32000
  max_completion_tokens: 32000

capabilities:
  - chat
  - function_calling

modalities:
  input: ["text","audio"]
  output: ["text"]

notes: "Instruct model with native audio input for speech understanding and tool use"

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 32000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
