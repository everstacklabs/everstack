# Verified 2026-11-24.
# Source: https://platform.kimi.ai/docs/pricing/chat
# Source: https://platform.kimi.ai/docs/guide/kimi-k3-1-pro-quickstart
# Release date from models.dev (moonshotai entry); the provider's pages do not state one.
name: "kimi-k3.1-pro-highspeed"
display_name: "Kimi K3.1 Pro Highspeed"
family: "kimi-k3"
status: "stable"
release_date: "2026-10-23"

cost:
  input_per_1k: 0.004
  output_per_1k: 0.02
  cache_read_per_1k: 0.0002
  cache_write_per_1k: 0.004
  cache_write_1h_per_1k: 0.008

limits:
  max_tokens: 1048576
  max_completion_tokens: 1048576

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image","video"]
  output: ["text"]

notes: "High-speed variant of Kimi K3.1 Pro, about 2-3x faster with the same capabilities. Always thinks (cannot be disabled); reasoning_effort low, high or max, default max. max_completion_tokens defaults to 131072 and can be raised to 1048576. temperature, top_p, n, presence_penalty and frequency_penalty are fixed; omit them. Images via base64 or ms:// file IDs only."
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 1048576
    has_max_value: true
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["low","high","max"]
variants:
  - id: "low"
    display_name: "Low reasoning"
    description: "Lower latency and cost for straightforward tasks."
    parameters:
      reasoning_effort: "low"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
  - id: "max"
    display_name: "Maximum reasoning"
    description: "Maximum available reasoning depth for the model."
    parameters:
      reasoning_effort: "max"
added_in_version: "2.11.0"
