# Catalogued 2026-11-24. Prices not checked against a Nebius page (sign-in required); in/out prices cross-checked for 9 models against OpenRouter's Nebius endpoints.
# Source: https://models.dev (Nebius list prices; https://tokenfactory.nebius.com/organization/prices requires sign-in)
name: "MiniMaxAI/MiniMax-M3"
display_name: "MiniMax-M3 (Nebius)"
family: "minimax-m"
status: "stable"
release_date: "2026-06-01"

cost:
  input_per_1k: 0.0003
  output_per_1k: 0.0012
  cache_read_per_1k: 0.00006

limits:
  max_tokens: 1048576
  max_completion_tokens: 1048576

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]
notes: "MiniMax multimodal model for long-context coding, perception, and agent planning"

structured_output: false
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 1048576
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
