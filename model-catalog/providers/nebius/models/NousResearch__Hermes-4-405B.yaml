# Catalogued 2026-11-24. Prices not checked against a Nebius page (sign-in required); in/out prices cross-checked for 9 models against OpenRouter's Nebius endpoints.
# Source: https://models.dev (Nebius list prices; https://tokenfactory.nebius.com/organization/prices requires sign-in)
name: "NousResearch/Hermes-4-405B"
display_name: "Hermes-4-405B (Nebius)"
family: "hermes"
status: "stable"
release_date: "2025-08-26"

cost:
  input_per_1k: 0.001
  output_per_1k: 0.003
  cache_read_per_1k: 0.0002

limits:
  max_tokens: 131072
  max_completion_tokens: 8192

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2024-08-31"
notes: "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"

structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 8192
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
