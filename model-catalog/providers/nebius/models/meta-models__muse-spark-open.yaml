# Catalogued 2026-11-24. Prices not checked against a Nebius page (sign-in required); in/out prices cross-checked for 9 models against OpenRouter's Nebius endpoints.
# Source: https://models.dev (Nebius list prices; https://tokenfactory.nebius.com/organization/prices requires sign-in)
name: "meta-models/muse-spark-open"
display_name: "Muse Spark Open (Nebius)"
family: "muse-spark"
status: "stable"
release_date: "2026-10-15"

cost:
  input_per_1k: 0.00125
  output_per_1k: 0.00425
  cache_read_per_1k: 0.00015

limits:
  max_tokens: 1048576
  max_completion_tokens: 1048576

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2026-01-04"
notes: "Muse Spark Open is an 816B total / 42B active open-weight multimodal reasoning model from Meta for coding and long-horizon agentic work, with 1M-token context."

structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 1048576
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
