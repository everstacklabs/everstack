# Catalogued 2026-11-24. Prices not checked against a Nebius page (sign-in required); in/out prices cross-checked for 9 models against OpenRouter's Nebius endpoints.
# Source: https://models.dev (Nebius list prices; https://tokenfactory.nebius.com/organization/prices requires sign-in)
name: "openai/gpt-oss-120b"
display_name: "gpt-oss-120b (Nebius)"
family: "gpt-oss"
status: "stable"
release_date: "2025-08-05"

cost:
  input_per_1k: 0.00015
  output_per_1k: 0.0006
  cache_read_per_1k: 0.0001

limits:
  max_tokens: 131072
  max_completion_tokens: 8192

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2024-06"
notes: "Open-weight GPT model for self-hosted reasoning and instruction-following workloads"

structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 8192
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
