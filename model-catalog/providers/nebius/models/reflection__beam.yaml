# Catalogued 2026-11-24. Prices not checked against a Nebius page (sign-in required); in/out prices cross-checked for 9 models against OpenRouter's Nebius endpoints.
# Source: https://models.dev (Nebius list prices; https://tokenfactory.nebius.com/organization/prices requires sign-in)
name: "reflection/beam"
display_name: "Beam 1.0 501B A23B (Nebius)"
family: "beam"
status: "stable"
release_date: "2026-10-05"

cost:
  input_per_1k: 0.00025
  output_per_1k: 0.001
  cache_read_per_1k: 0.00005

limits:
  max_tokens: 1048576
  max_completion_tokens: 131072

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2026-06-30"
notes: "Sparse mixture-of-experts reasoning model with 23B active parameters for coding and agentic workflows"

structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 131072
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
