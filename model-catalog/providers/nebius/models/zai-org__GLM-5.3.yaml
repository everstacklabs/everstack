# Catalogued 2026-11-24. Prices not checked against a Nebius page (sign-in required); in/out prices cross-checked for 9 models against OpenRouter's Nebius endpoints.
# Source: https://models.dev (Nebius list prices; https://tokenfactory.nebius.com/organization/prices requires sign-in)
name: "zai-org/GLM-5.3"
display_name: "GLM-5.3 (Nebius)"
family: "glm"
status: "stable"
release_date: "2026-08-14"

cost:
  input_per_1k: 0.0014
  output_per_1k: 0.0044
  cache_read_per_1k: 0.00026

limits:
  max_tokens: 1024000
  max_completion_tokens: 1024000

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]
notes: "Flagship GLM model for long-horizon coding, agents, and complex project delivery"

structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 1024000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
added_in_version: "2.11.0"
