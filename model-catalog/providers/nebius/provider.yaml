name: "nebius"
display_name: "Nebius Token Factory"
# Documented as https://api.tokenfactory.nebius.com/v1/ ; the trailing slash is
# dropped because the adapter appends /chat/completions.
base_url: "https://api.tokenfactory.nebius.com/v1"
api_version: "2024-01-01"

provider_type: "meta"
supports_model_discovery: false

auth:
  type: "api_key"
  header_name: "Authorization"
  header_format: "Bearer {api_key}"
  env_var: "NEBIUS_API_KEY"

rate_limits:
  requests_per_minute: 1200
  tokens_per_minute: 240000
  concurrent_requests: 30

capabilities:
  chat: true
  completions: false
  embeddings: false
  function_calling: true
  vision: false
  streaming: true
  fine_tuning: false
  assistants: false

model_families:
  kimi:
    description: "Kimi family via Nebius Token Factory"
    capabilities: ["chat", "function_calling", "reasoning"]
  glm:
    description: "GLM family via Nebius Token Factory"
    capabilities: ["chat", "function_calling", "reasoning"]
  nemotron:
    description: "NVIDIA Nemotron family via Nebius Token Factory"
    capabilities: ["chat", "function_calling", "reasoning"]
  qwen:
    description: "Qwen family via Nebius Token Factory"
    capabilities: ["chat", "function_calling"]
