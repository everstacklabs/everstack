name: "meta/llama-3.3-70b-instruct"
display_name: "Llama 3.3 70B Instruct"
family: "llama"
status: "stable"
release_date: "2024-11-26"

cost:
  input_per_1k: 0
  output_per_1k: 0

limits:
  max_tokens: 128000
  max_completion_tokens: 4096

capabilities:
  - chat
  - function_calling

modalities:
  input: ["text"]
  output: ["text"]

notes: "Pricing on NVIDIA NIM is per-deployment / self-hosted; $0 indicates no per-token charge"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 4096
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
