name: chatgpt-4o-latest
display_name: Chatgpt 4o Latest
family: other
status: stable
limits:
    max_tokens: 128000
capabilities:
    - chat
    - function_calling
    - vision
modalities:
    input:
        - text
        - image
    output:
        - text

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
