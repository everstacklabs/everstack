name: gpt-4.1
display_name: GPT-4.1
family: gpt-4
status: "stable"
release_date: "2025-04-14"
cost:
  input_per_1k: 0.002
  output_per_1k: 0.008
  cache_read_per_1k: 0.0005

limits:
  max_tokens: 1047576
  max_completion_tokens: 32768

capabilities:
  - chat
  - function_calling
  - vision

modalities:
  input: ["text","image","pdf"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 32768
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
