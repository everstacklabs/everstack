name: "gpt-5-pro"
display_name: "GPT-5 Pro"
family: "gpt-5"
status: "stable"
release_date: "2025-10-06"

cost:
  input_per_1k: 0.015
  output_per_1k: 0.12

limits:
  max_tokens: 400000
  max_completion_tokens: 272000

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 272000
    has_max_value: true
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["high"]
  - key: "verbosity"
    display_name: "Verbosity"
    type: "enum"
    options: ["low","medium","high"]
variants:
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
