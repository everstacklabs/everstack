name: gpt-5-search-api
display_name: Gpt 5 Search Api
family: gpt-5
status: stable
limits:
    max_tokens: 128000
    max_completion_tokens: 16384
capabilities:
    - chat
    - function_calling
    - vision
modalities:
    input:
        - text
        - image
    output:
        - text

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 16384
    has_max_value: true
  - key: "verbosity"
    display_name: "Verbosity"
    type: "enum"
    options: ["low","medium","high"]
