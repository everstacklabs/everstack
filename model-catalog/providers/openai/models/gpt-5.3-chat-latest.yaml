name: "gpt-5.3-chat-latest"
display_name: "GPT-5.3 Chat (Latest)"
family: "gpt-5"
status: "stable"
release_date: "2026-03-03"

cost:
  input_per_1k: 0.00175
  output_per_1k: 0.014
  cache_read_per_1k: 0.000175

limits:
  max_tokens: 128000
  max_completion_tokens: 16384

capabilities:
  - chat
  - function_calling
  - vision

modalities:
  input: ["text","image"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 16384
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
  - key: "verbosity"
    display_name: "Verbosity"
    type: "enum"
    options: ["low","medium","high"]
