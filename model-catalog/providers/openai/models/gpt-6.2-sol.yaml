# Verified 2026-11-24.
# Source: https://developers.openai.com/api/docs/models/gpt-6.2-sol
# Source: https://developers.openai.com/api/docs/changelog
name: "gpt-6.2-sol"
display_name: "GPT-6.2 Sol"
family: "gpt-6"
status: "stable"
release_date: "2026-11-17"
api_type: "responses"
cost:
  input_per_1k: 0.002
  output_per_1k: 0.01
  cache_read_per_1k: 0.0001
  cache_write_per_1k: 0.0025
  long_context:
    threshold_tokens: 272000
    input_multiplier: 2
    cache_multiplier: 2
    output_multiplier: 1.5
limits:
  max_tokens: 1050000
  max_completion_tokens: 128000
capabilities:
  - "chat"
  - "function_calling"
  - "vision"
  - "reasoning"
  - "computer_use"
  - "coding"
modalities:
  input:
    - "text"
    - "image"
  output:
    - "text"
knowledge_cutoff: "2026-06-01"
notes: "Everyday coding and agent workflows. Tool calling requires the Responses API. Reasoning effort none is rejected; OpenAI does not publish the full effort list for GPT-6.2, so only low, medium and high are listed; omit temperature, top_p, logprobs and top_logprobs; Flex processing is not supported. Cache write price is the 30-minute retention rate. Prompts over 272K input tokens bill the whole request at 2x input and cache rates and 1.5x output."
unsupported_parameters:
  - "temperature"
  - "top_p"
structured_output: false
parameters:
  -
    key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 128000
    has_max_value: true
  -
    key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options:
      - "low"
      - "medium"
      - "high"
variants:
  -
    id: "low"
    display_name: "Low reasoning"
    parameters:
      reasoning_effort: "low"
  -
    id: "medium"
    display_name: "Medium reasoning"
    parameters:
      reasoning_effort: "medium"
  -
    id: "high"
    display_name: "High reasoning"
    parameters:
      reasoning_effort: "high"
added_in_version: "2.11.0"
