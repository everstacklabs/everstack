name: "anthropic/claude-sonnet-4"
display_name: "Claude Sonnet 4"
family: "claude"
status: "stable"
release_date: "2025-05-22"

cost:
  input_per_1k: 0.003
  output_per_1k: 0.015
  cache_read_per_1k: 0.0003
  cache_write_per_1k: 0.00375

limits:
  max_tokens: 1000000
  max_completion_tokens: 64000

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["image","text","pdf"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 64000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
