name: "deepseek/deepseek-v4-flash-vision-exp"
display_name: "DeepSeek V4 Flash Vision Exp (OpenRouter)"
family: "deepseek-flash"
status: "stable"
release_date: "2026-08-21"

cost:
  input_per_1k: 0.00022
  output_per_1k: 0.00066
  cache_read_per_1k: 0.000007

limits:
  max_tokens: 1048576
  max_completion_tokens: 384000

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]

notes: "Fast DeepSeek model for efficient chat, coding help, and agent loops"

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 384000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
