name: "moonshotai/kimi-k2.7-code"
display_name: "Kimi K2.7 Code (OpenRouter)"
family: "kimi-k2"
status: "stable"
release_date: "2026-06-12"

cost:
  input_per_1k: 0.00067
  output_per_1k: 0.0034
  cache_read_per_1k: 0.00019

limits:
  max_tokens: 262144
  max_completion_tokens: 235929

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]

knowledge_cutoff: "2025-01"
notes: "Coding-focused Kimi model, stronger on long-horizon repo work with less overthinking"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 262144
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
