name: "moonshotai/kimi-k3"
display_name: "Kimi K3 (OpenRouter)"
family: "kimi-k3"
status: "stable"
release_date: "2026-07-16"

cost:
  input_per_1k: 0.003
  output_per_1k: 0.015
  cache_read_per_1k: 0.0003

limits:
  max_tokens: 1048576
  max_completion_tokens: 943718

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image","video"]
  output: ["text"]

notes: "Kimi multimodal agent model for visual understanding, coding, and planning"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 1048576
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["low","high","max"]
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
variants:
  - id: "low"
    display_name: "Low reasoning"
    description: "Lower latency and cost for straightforward tasks."
    parameters:
      reasoning_effort: "low"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
  - id: "max"
    display_name: "Maximum reasoning"
    description: "Maximum available reasoning depth for the model."
    parameters:
      reasoning_effort: "max"
