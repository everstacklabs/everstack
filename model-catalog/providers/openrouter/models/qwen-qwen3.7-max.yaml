name: "qwen/qwen3.7-max"
display_name: "Qwen3.7 Max (OpenRouter)"
family: "qwen"
status: "stable"
release_date: "2026-05-21"

cost:
  input_per_1k: 0.001475
  output_per_1k: 0.004425
  cache_read_per_1k: 0.000295
  cache_write_per_1k: 0.00184375

limits:
  max_tokens: 1000000
  max_completion_tokens: 131072

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

notes: "Qwen frontier model tuned for agent frameworks, coding assistants, and long tasks"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 65536
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
