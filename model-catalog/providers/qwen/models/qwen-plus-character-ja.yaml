name: "qwen-plus-character-ja"
display_name: "Qwen Plus Character (Japanese)"
family: "qwen"
status: "stable"
release_date: "2024-01"

cost:
  input_per_1k: 0.0005
  output_per_1k: 0.0014

limits:
  max_tokens: 8192
  max_completion_tokens: 512

capabilities:
  - chat
  - function_calling

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2024-04"
notes: "Qwen instruction model for multilingual chat, reasoning, and tool use"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 512
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
