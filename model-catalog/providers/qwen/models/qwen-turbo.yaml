name: "qwen-turbo"
display_name: "Qwen Turbo"
family: "qwen"
status: "stable"
release_date: "2024-11-01"

cost:
  input_per_1k: 0.00005
  output_per_1k: 0.0002

limits:
  max_tokens: 1000000
  max_completion_tokens: 16384

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2024-04"
notes: "Efficient Qwen model for fast chat, extraction, and high-volume workloads"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 16384
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_enabled"
    display_name: "Reasoning"
    type: "boolean"
  - key: "reasoning_budget_tokens"
    display_name: "Reasoning token budget"
    type: "integer"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
