name: "qwen-vl-max"
display_name: "Qwen VL Max"
family: "qwen-vl"
status: "stable"
release_date: "2024-04-08"

cost:
  input_per_1k: 0.0008
  output_per_1k: 0.0032

limits:
  max_tokens: 131072
  max_completion_tokens: 8192

capabilities:
  - chat
  - function_calling
  - vision

modalities:
  input: ["text","image"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 8192
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
