name: "qwen3-next-80b-a3b-thinking"
display_name: "Qwen3 Next 80B-A3B Thinking"
family: "qwen3"
status: "stable"
release_date: "2025-09"

cost:
  input_per_1k: 0.0005
  output_per_1k: 0.006

limits:
  max_tokens: 131072
  max_completion_tokens: 32768

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 32768
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_budget_tokens"
    display_name: "Reasoning token budget"
    type: "integer"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
