name: "qwen3.5-flash"
display_name: "Qwen3.5 Flash"
family: "qwen3.5"
status: "stable"

cost:
  input_per_1k: 0.0001
  output_per_1k: 0.0004

limits:
  max_tokens: 1000000
  max_completion_tokens: 16384

capabilities:
  - chat
  - function_calling
  - vision

modalities:
  input: ["text", "image"]
  output: ["text"]

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 16384
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
