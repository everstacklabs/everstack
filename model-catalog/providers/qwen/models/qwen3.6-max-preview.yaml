name: "qwen3.6-max-preview"
display_name: "Qwen3.6 Max Preview"
family: "qwen"
status: "preview"
release_date: "2026-04-20"

cost:
  input_per_1k: 0.0013
  output_per_1k: 0.0078
  cache_read_per_1k: 0.00013
  cache_write_per_1k: 0.001625

limits:
  max_tokens: 262144
  max_completion_tokens: 65536

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

knowledge_cutoff: "2025-04"
notes: "Flagship Qwen model for complex reasoning, coding, and agentic workflows"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 65536
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_enabled"
    display_name: "Reasoning"
    type: "boolean"
  - key: "reasoning_budget_tokens"
    display_name: "Reasoning token budget"
    type: "integer"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
