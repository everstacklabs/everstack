name: "qwen3.7-plus"
display_name: "Qwen3.7 Plus"
family: "qwen"
status: "stable"
release_date: "2026-06-02"

cost:
  input_per_1k: 0.0005
  output_per_1k: 0.003
  cache_read_per_1k: 0.00005
  cache_write_per_1k: 0.000625

limits:
  max_tokens: 1000000
  max_completion_tokens: 65536

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image","video"]
  output: ["text"]

knowledge_cutoff: "2025-04"
notes: "Multimodal Qwen workhorse for long-context agents, visual inputs, and coding"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 65536
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_enabled"
    display_name: "Reasoning"
    type: "boolean"
  - key: "reasoning_budget_tokens"
    display_name: "Reasoning token budget"
    type: "integer"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
