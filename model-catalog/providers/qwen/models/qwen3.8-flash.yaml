name: "qwen3.8-flash"
display_name: "Qwen3.8 Flash"
family: "qwen"
status: "stable"
release_date: "2026-08-26"

cost:
  input_per_1k: 0.00015
  output_per_1k: 0.00047
  cache_read_per_1k: 1.6e-05
  cache_write_per_1k: 0.0002

limits:
  max_tokens: 1000000
  max_completion_tokens: 131072

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image","video"]
  output: ["text"]

notes: "Fast, low-cost Qwen model with 1M context and thinking and non-thinking modes at the same price (International deployment, Singapore rates). Cache read is the implicit or explicit cache hit rate; cache write is the explicit cache creation rate."

parameters:
