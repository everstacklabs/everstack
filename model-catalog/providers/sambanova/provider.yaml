name: "sambanova"
display_name: "SambaNova"
base_url: "https://api.sambanova.ai/v1"
api_version: "2024-01-01"

provider_type: "meta"
supports_model_discovery: false

auth:
  type: "api_key"
  header_name: "Authorization"
  header_format: "Bearer {api_key}"
  env_var: "SAMBANOVA_API_KEY"

rate_limits:
  requests_per_minute: 1200
  tokens_per_minute: 240000
  concurrent_requests: 30

capabilities:
  chat: true
  completions: false
  embeddings: false
  function_calling: true
  vision: false
  streaming: true
  fine_tuning: false
  assistants: false

model_families:
  glm:
    description: "GLM-5.3 on SambaNova Cloud"
    capabilities: ["chat", "function_calling", "reasoning"]
  minimax:
    description: "MiniMax M3.1 Flash on SambaNova Cloud"
    capabilities: ["chat", "function_calling", "reasoning"]
  open-weight:
    description: "Gemma 4 and gpt-oss on SambaNova Cloud"
    capabilities: ["chat", "function_calling", "reasoning"]
