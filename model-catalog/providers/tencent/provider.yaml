name: "tencent"
display_name: "Tencent TokenHub"
# Singapore (global) host. Guangzhou and Silicon Valley hosts are listed at
# https://www.tencentcloud.com/document/product/1300/80632; set base_url to use
# one. A model must be activated in the TokenHub console before it is called.
base_url: "https://tokenhub-intl.tencentcloudmaas.com/v1"
api_version: "2024-01-01"

provider_type: "static"
supports_model_discovery: false

auth:
  type: "api_key"
  header_name: "Authorization"
  header_format: "Bearer {api_key}"
  env_var: "TENCENT_TOKENHUB_API_KEY"

rate_limits:
  requests_per_minute: 1200
  tokens_per_minute: 240000
  concurrent_requests: 30

capabilities:
  chat: true
  completions: false
  embeddings: false
  function_calling: true
  vision: false
  streaming: true
  fine_tuning: false
  assistants: false

model_families:
  hy:
    description: "Tencent Hy (Hunyuan) reasoning models"
    capabilities: ["chat", "function_calling", "reasoning"]
