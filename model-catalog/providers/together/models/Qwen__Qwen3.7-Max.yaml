name: "Qwen/Qwen3.7-Max"
display_name: "Qwen3.7 Max (Together)"
family: "qwen"
status: "stable"
release_date: "2026-05-21"

cost:
  input_per_1k: 0.00125
  output_per_1k: 0.00375
  cache_read_per_1k: 0.000125

limits:
  max_tokens: 1000000
  max_completion_tokens: 500000

capabilities:
  - chat
  - function_calling

modalities:
  input: ["text"]
  output: ["text"]

notes: "Flagship Qwen model for complex reasoning, coding, and agentic workflows"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 500000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
