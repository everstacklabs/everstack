name: "nvidia/nemotron-3-ultra-550b-a55b"
display_name: "Nemotron 3 Ultra 550B A55B (Together)"
family: "nemotron"
status: "stable"
release_date: "2026-06-04"

cost:
  input_per_1k: 0.0006
  output_per_1k: 0.0036
  cache_read_per_1k: 0.0002

limits:
  max_tokens: 512300
  max_completion_tokens: 512300

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

notes: "Largest Nemotron 3 model for maximum open-weight reasoning and agent accuracy"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 512300
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
