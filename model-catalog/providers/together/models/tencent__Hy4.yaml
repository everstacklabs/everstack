name: "tencent/Hy4"
display_name: "Hy4 (Together)"
family: "hy"
status: "stable"
release_date: "2026-11-04"

cost:
  input_per_1k: 0.000834
  output_per_1k: 0.002501
  cache_read_per_1k: 0.000042

limits:
  max_tokens: 1048576
  max_completion_tokens: 65536

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image"]
  output: ["text"]
notes: "A next-generation multimodal productivity model with significantly enhanced Agent and complex task execution capabilities."
structured_output: true
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 65536
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["none","high"]
variants:
  - id: "none"
    display_name: "No reasoning"
    description: "Fastest response with reasoning disabled when the model permits it."
    parameters:
      reasoning_effort: "none"
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
added_in_version: "2.11.0"
