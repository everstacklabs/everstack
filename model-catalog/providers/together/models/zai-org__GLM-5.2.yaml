name: "zai-org/GLM-5.2"
display_name: "GLM-5.2 (Together)"
family: "glm"
status: "stable"
release_date: "2026-06-16"

cost:
  input_per_1k: 0.0014
  output_per_1k: 0.0044
  cache_read_per_1k: 0.00026

limits:
  max_tokens: 512000
  max_completion_tokens: 164000

capabilities:
  - chat
  - function_calling
  - reasoning

modalities:
  input: ["text"]
  output: ["text"]

notes: "Open flagship GLM for long-horizon coding agents and million-token context work"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 164000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "reasoning_effort"
    display_name: "Reasoning effort"
    type: "enum"
    options: ["high","max"]
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
variants:
  - id: "high"
    display_name: "High reasoning"
    description: "Deeper reasoning for complex analysis and coding."
    parameters:
      reasoning_effort: "high"
  - id: "max"
    display_name: "Maximum reasoning"
    description: "Maximum available reasoning depth for the model."
    parameters:
      reasoning_effort: "max"
