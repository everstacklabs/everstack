name: "claude-fable-5-2@default"
display_name: "Claude Fable 5.2 (Vertex)"
family: "claude-fable"
status: "stable"
release_date: "2026-11-09"

cost:
  input_per_1k: 0.008
  output_per_1k: 0.04
  cache_read_per_1k: 0.0002
  cache_write_per_1k: 0.01

limits:
  max_tokens: 1000000
  max_completion_tokens: 128000

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image","pdf"]
  output: ["text"]

knowledge_cutoff: "2026-06"
notes: "Claude model for demanding reasoning and long-horizon agentic work"
unsupported_parameters:
  - "temperature"
  - "top_p"
  - "top_k"
  - "thinking_toggle"
  - "thinking_budget"
structured_output: false
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 128000
    has_max_value: true
added_in_version: "2.11.0"
