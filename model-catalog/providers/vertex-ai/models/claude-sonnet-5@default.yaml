name: "claude-sonnet-5@default"
display_name: "Claude Sonnet 5 (Vertex)"
family: "claude-sonnet"
status: "stable"
release_date: "2026-06-30"

cost:
  input_per_1k: 0.002
  output_per_1k: 0.01
  cache_read_per_1k: 0.0002
  cache_write_per_1k: 0.0025

limits:
  max_tokens: 1000000
  max_completion_tokens: 128000

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image","pdf"]
  output: ["text"]

knowledge_cutoff: "2026-01-31"
notes: "Everyday Claude agent model for coding, planning, browsing, and general work"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 128000
    has_max_value: true
