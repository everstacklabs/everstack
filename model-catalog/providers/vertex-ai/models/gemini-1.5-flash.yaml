name: "gemini-1.5-flash"
display_name: "Gemini 1.5 Flash"
family: "gemini"
status: "stable"

cost:
  input_per_1k: 0.000075
  output_per_1k: 0.0003

limits:
  max_tokens: 1048576
  max_completion_tokens: 8192

capabilities:
  - chat
  - function_calling
  - vision

modalities:
  input: ["text", "image", "video", "audio"]
  output: ["text"]
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 8192
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
