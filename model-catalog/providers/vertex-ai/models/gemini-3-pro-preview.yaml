name: "gemini-3-pro-preview"
display_name: "Gemini 3 Pro (Preview, Vertex)"
family: "gemini-3"
status: "preview"

cost:
  input_per_1k: 0.002
  output_per_1k: 0.012
  cache_read_per_1k: 0.0002

limits:
  max_tokens: 1000000
  max_completion_tokens: 64000

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text", "image", "video", "audio", "pdf"]
  output: ["text"]

notes: "Pricing doubles for context > 200K tokens"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 64000
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
