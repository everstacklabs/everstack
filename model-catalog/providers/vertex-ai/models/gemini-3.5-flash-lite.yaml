name: "gemini-3.5-flash-lite"
display_name: "Gemini 3.5 Flash Lite (Vertex)"
family: "gemini-flash-lite"
status: "stable"
release_date: "2026-07-21"

cost:
  input_per_1k: 0.0003
  output_per_1k: 0.0025
  cache_read_per_1k: 0.00003

limits:
  max_tokens: 1048576
  max_completion_tokens: 65536

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image","video","audio","pdf"]
  output: ["text"]

knowledge_cutoff: "2026-03"
notes: "Fast Gemini model balancing multimodal reasoning, tool use, and cost"
parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 65536
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
