# Verified 2026-11-24.
# Source: https://docs.z.ai/guides/llm/glm-5.3-flash
# Source: https://docs.z.ai/guides/overview/pricing
name: "glm-5.3-flash"
display_name: "GLM-5.3-Flash"
family: "glm"
status: "stable"
release_date: "2026-08-26"

cost:
  input_per_1k: 0.00015
  output_per_1k: 0.0005
  cache_read_per_1k: 3.0e-05
  cache_write_per_1k: 0

limits:
  max_tokens: 1000000
  max_completion_tokens: 131072

capabilities:
  - chat
  - function_calling
  - vision
  - reasoning

modalities:
  input: ["text","image","video","pdf"]
  output: ["text"]

notes: "Low-cost GLM-5.3 variant with native vision and 1M context. Thinking is always on (thinking.type accepts only enabled); Z.ai recommends clear_thinking false and reasoning_effort max. Cache storage is free for a limited time."

parameters:
  - key: "max_output_tokens"
    display_name: "Max output tokens"
    type: "integer"
    min_value: 1
    has_min_value: true
    max_value: 131072
    has_max_value: true
  - key: "temperature"
    display_name: "Temperature"
    type: "number"
  - key: "top_p"
    display_name: "Top P"
    type: "number"
    min_value: 0
    has_min_value: true
    max_value: 1
    has_max_value: true
  - key: "top_k"
    display_name: "Top K"
    type: "integer"
    min_value: 1
    has_min_value: true
  - key: "frequency_penalty"
    display_name: "Frequency penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "presence_penalty"
    display_name: "Presence penalty"
    type: "number"
    min_value: -2
    has_min_value: true
    max_value: 2
    has_max_value: true
  - key: "seed"
    display_name: "Seed"
    type: "integer"
added_in_version: "2.11.0"
