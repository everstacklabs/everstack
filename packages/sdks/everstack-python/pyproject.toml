[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everstack"
version = "0.1.0"
description = "The official Python SDK for the Everstack AI platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Everstack Labs" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    "typing-extensions>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.30",
    "mypy>=1.5",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://everstack.ai"
Documentation = "https://docs.everstack.ai/sdks/python"
Repository = "https://github.com/everstacklabs/everstack-python"

[tool.hatch.build.targets.wheel]
packages = ["src/everstack"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
