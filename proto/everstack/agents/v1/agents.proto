// --- Immutable agent source revisions ---

// AgentRevisionFile is one immutable source file stored with a revision.
message AgentRevisionFile {
  string path = 1 [(validate.rules).string = {
    min_bytes: 1
    max_bytes: 4096
    pattern: "^[^\\\\\\x00-\\x1F\\x7F]+$"
  }];
  bytes content = 2 [(validate.rules).bytes.max_len = 2097152];
  string sha256 = 3 [(validate.rules).string = {
    pattern: "^$|^[0-9a-f]{64}$"
  }];
  int32 mode = 4 [(validate.rules).int32 = {
    gte: 0
    lte: 511
  }];
  int64 size_bytes = 5 [(validate.rules).int64 = {
    gte: 0
    lte: 2097152
  }];
}

// AgentProjectFunction exposes one source file export as an agent tool.
message AgentProjectFunction {
  string name = 1 [(validate.rules).string = {
    pattern: "^[a-z][a-z0-9_]{1,63}$"
  }];
  string description = 2 [(validate.rules).string.max_bytes = 4096];
  string path = 3 [(validate.rules).string = {
    min_bytes: 1
    max_bytes: 4096
    pattern: "^[^\\\\\\x00-\\x1F\\x7F]+$"
  }];
  string export_name = 4 [(validate.rules).string = {
    max_bytes: 128
    pattern: "^$|^[A-Za-z_$][A-Za-z0-9_$]{0,127}$"
  }];
  string runtime = 5 [(validate.rules).string = {
    in: [
      "deno",
      "nodejs20",
      "python3"
    ]
  }];
  google.protobuf.Struct parameters = 6;
}

// AgentRevision is an immutable, content-addressed agent source project.
message AgentRevision {
  string id = 1;
  string tenant_id = 2;
  string agent_id = 3;
  int32 number = 4;
  string digest = 5;
  int32 format = 6;
  repeated AgentRevisionFile files = 7;
  repeated AgentProjectFunction functions = 8;
  string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
}

message CreateAgentRevisionRequest {
  string tenant_id = 1;
  string agent_id = 2 [(validate.rules).string = {
    min_bytes: 1
    max_bytes: 128
  }];
  repeated AgentRevisionFile files = 3 [(validate.rules).repeated = {
    min_items: 1
    max_items: 512
    items: {
      message: {required: true}
    }
  }];
  repeated AgentProjectFunction functions = 4 [(validate.rules).repeated = {
    max_items: 128
    items: {
      message: {required: true}
    }
  }];
}

message CreateAgentRevisionResponse {
  AgentRevision revision = 1;
  bool created = 2;
}

message GetActiveAgentRevisionRequest {
  string tenant_id = 1;
  string agent_id = 2 [(validate.rules).string = {
    min_bytes: 1
    max_bytes: 128
  }];
}

message GetActiveAgentRevisionResponse {
  AgentRevision revision = 1;
}

message GetAgentRevisionRequest {
  string tenant_id = 1;
  string revision_id = 2 [(validate.rules).string = {
    min_bytes: 1
    max_bytes: 128
  }];
}

message GetAgentRevisionResponse {
  AgentRevision revision = 1;
}
