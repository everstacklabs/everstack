message MetricSnapshot {
  string sandbox_id = 1;
  double cpu_percent = 2;
  int64 memory_usage = 3;
  int64 memory_limit = 4;
  int64 disk_used_mb = 5;
  // RFC 3339 collection timestamp.
  string collected_at = 6;
}

message SandboxMetricsHistoryRequest {
  string sandbox_id = 1;
  // Max snapshots to return (default 120).
  int32 limit = 2;
}

message SandboxMetricsHistoryResponse {
  repeated MetricSnapshot snapshots = 1;
  int32 total = 2;
}

message SandboxMetricsBatchRequest {
  // Sandbox IDs to fetch the latest snapshot for (capped at 50).
  repeated string ids = 1;
}

message SandboxMetricsBatchResponse {
  // Latest snapshot keyed by sandbox_id.
  map<string, MetricSnapshot> metrics = 1;
}

// Computer Use (#300): screenshot, mouse/keyboard control, screen recording.
// A single op-multiplexed RPC mirroring the original handler; fields are
// per-op and optional. screenshot returns image bytes (base64 over REST).
message ComputerUseRequest {
  string sandbox_id = 1;
  // screenshot | displays | mouse/click | mouse/move | mouse/scroll |
  // mouse/drag | keyboard/type | keyboard/key | recording/start | recording/stop
  string op = 2;
  string format = 3;        // screenshot (jpeg|png), default jpeg
  int32 quality = 4;        // screenshot, default 85
  int32 x = 5;              // mouse ops / drag "from"
  int32 y = 6;
  string button = 7;        // mouse/click (left|right|middle)
  bool double_click = 8;    // mouse/click
  string text = 9;          // keyboard/type
  string key = 10;          // keyboard/key
  string direction = 11;    // mouse/scroll (up|down)
  int32 amount = 12;        // mouse/scroll
  int32 to_x = 13;          // mouse/drag "to"
  int32 to_y = 14;
  int32 fps = 15;           // recording/start, default 15
  string label = 16;        // recording/start
  string recording_id = 17; // recording/stop
}

message DisplayInfo {
  int32 id = 1;
  string display = 2;
  int32 width = 3;
  int32 height = 4;
  bool is_primary = 5;
}

message ComputerUseResponse {
  string status = 1;                // "ok" for action ops
  bytes image = 2;                  // screenshot (base64-encoded in REST JSON)
  string format = 3;                // screenshot image format
  repeated DisplayInfo displays = 4;
  string recording_id = 5;          // recording/start
  string file = 6;                  // recording/start
}

message ComputerUseInfoRequest {
  string sandbox_id = 1;
}

message ComputerUseInfoResponse {
  string sandbox_id = 1;
  repeated string operations = 2;
  string note = 3;
}

