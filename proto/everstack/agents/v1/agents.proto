// ─── Troopers ─────────────────────────────────────────────────────

// TrooperStatus tracks the lifecycle of a trooper.
enum TrooperStatus {
  TROOPER_STATUS_UNSPECIFIED = 0;
  TROOPER_STATUS_CREATED = 1;
  TROOPER_STATUS_PROVISIONING = 2;
  TROOPER_STATUS_RUNNING = 3;
  TROOPER_STATUS_SLEEPING = 4;
  TROOPER_STATUS_WAKING = 5;
  TROOPER_STATUS_FAILED = 6;
  TROOPER_STATUS_TERMINATED = 7;
}

// TrooperLinkType describes the relationship between linked entities.
enum TrooperLinkType {
  TROOPER_LINK_TYPE_UNSPECIFIED = 0;
  TROOPER_LINK_TYPE_COLLABORATOR = 1;
  TROOPER_LINK_TYPE_SUPERVISOR = 2;
  TROOPER_LINK_TYPE_SUBORDINATE = 3;
  TROOPER_LINK_TYPE_PEER = 4;
}

// TrooperLinkProtocol describes how linked entities communicate.
enum TrooperLinkProtocol {
  TROOPER_LINK_PROTOCOL_UNSPECIFIED = 0;
  TROOPER_LINK_PROTOCOL_INTERNAL = 1;
  TROOPER_LINK_PROTOCOL_CHANNEL = 2;
  TROOPER_LINK_PROTOCOL_WEBHOOK = 3;
}

// TrooperLinkStatus tracks whether a link is active.
enum TrooperLinkStatus {
  TROOPER_LINK_STATUS_UNSPECIFIED = 0;
  TROOPER_LINK_STATUS_ACTIVE = 1;
  TROOPER_LINK_STATUS_PAUSED = 2;
  TROOPER_LINK_STATUS_REVOKED = 3;
}

// TrooperIdentity holds the identity markdown files for a trooper.
message TrooperIdentity {
  string soul_md = 1;
  string identity_md = 2;
  string user_md = 3;
  string role_md = 4;
}

// TrooperSandboxConfig holds sandbox resource configuration.
message TrooperSandboxConfig {
  string image = 1;
  double cpu_limit = 2;
  int64 memory_mb = 3;
  int64 disk_mb = 4;
  int32 timeout_seconds = 5;
  string network_mode = 6;
  repeated string allowed_hosts = 7;
  map<string, string> env_vars = 8;
  bool ssh_enabled = 9;
  string git_repo_url = 10;
  string git_branch = 11;
}

// TrooperDatabaseConfig holds paths for trooper-local databases.
message TrooperDatabaseConfig {
  string sqlite_path = 1;
  string lancedb_path = 2;
  string redb_path = 3;
}

// TrooperWorkersConfig holds worker pool settings.
message TrooperWorkersConfig {
  int32 max_concurrent_workers = 1;
  google.protobuf.Struct pool_config = 2;
}

// Trooper is a first-class intelligent agent environment.
message Trooper {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  TrooperStatus status = 5;

  // Embedded agent config
  string model = 6;
  string system_prompt = 7;
  repeated string tools = 8;
  google.protobuf.Struct agent_config = 9;
  int32 max_turns = 10;
  int32 max_tool_calls_per_turn = 11;
  optional int32 max_steps = 12;

  // Identity
  TrooperIdentity identity = 13;

  // Sandbox
  TrooperSandboxConfig sandbox = 14;
  string sandbox_id = 15;

  // Databases
  TrooperDatabaseConfig databases = 16;

  // Workers
  TrooperWorkersConfig workers = 17;

  // Display
  optional string color = 18;
  optional string icon = 19;

  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

// TrooperLink represents a connection between a trooper and another entity.
message TrooperLink {
  string id = 1;
  string tenant_id = 2;
  string source_trooper_id = 3;
  string target_type = 4;
  string target_id = 5;
  string target_name = 6;
  TrooperLinkType link_type = 7;
  TrooperLinkProtocol protocol = 8;
  TrooperLinkStatus status = 9;
  google.protobuf.Struct config = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// TrooperChannelBinding represents a channel bound to a trooper.
message TrooperChannelBinding {
  string id = 1;
  string trooper_id = 2;
  string channel_config_id = 3;
  bool enabled = 4;
  google.protobuf.Timestamp created_at = 5;
}

