syntax = "proto3";

package everstack.agents.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "github.com/everstacklabs/everstack/pkg/grpc/everstack/agents/v1;agents";

// SessionStatus tracks the lifecycle of an agent session.
enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_CREATED = 1;
  SESSION_STATUS_RUNNING = 2;
  SESSION_STATUS_WAITING_FOR_INPUT = 3;
  SESSION_STATUS_WAITING_FOR_APPROVAL = 4;
  SESSION_STATUS_COMPLETED = 5;
  SESSION_STATUS_FAILED = 6;
  SESSION_STATUS_CANCELLED = 7;
  SESSION_STATUS_HIBERNATED = 8;
}

// TurnStatus tracks the lifecycle of a single turn.
enum TurnStatus {
  TURN_STATUS_UNSPECIFIED = 0;
  TURN_STATUS_PENDING = 1;
  TURN_STATUS_RUNNING = 2;
  TURN_STATUS_COMPLETED = 3;
  TURN_STATUS_FAILED = 4;
}

// AgentMode controls whether an agent is user-facing or delegation-only.
enum AgentMode {
  AGENT_MODE_UNSPECIFIED = 0;
  AGENT_MODE_PRIMARY = 1;
  AGENT_MODE_SUBAGENT = 2;
}

// TaskPermissionMode controls delegation behavior for task/spawn execution.
enum TaskPermissionMode {
  TASK_PERMISSION_MODE_UNSPECIFIED = 0;
  TASK_PERMISSION_MODE_ASK = 1;
  TASK_PERMISSION_MODE_ALWAYS = 2;
  TASK_PERMISSION_MODE_DENY = 3;
}

// AgentLifecycleMode distinguishes ephemeral (session-scoped) from persistent (always-on) agents.
enum AgentLifecycleMode {
  AGENT_LIFECYCLE_MODE_UNSPECIFIED = 0;
  AGENT_LIFECYCLE_MODE_EPHEMERAL = 1;
  AGENT_LIFECYCLE_MODE_PERSISTENT = 2;
}

// AgentLifecycleStatus tracks the lifecycle of a persistent agent.
enum AgentLifecycleStatus {
  AGENT_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  AGENT_LIFECYCLE_STATUS_CREATED = 1;
  AGENT_LIFECYCLE_STATUS_PROVISIONING = 2;
  AGENT_LIFECYCLE_STATUS_RUNNING = 3;
  AGENT_LIFECYCLE_STATUS_SLEEPING = 4;
  AGENT_LIFECYCLE_STATUS_WAKING = 5;
  AGENT_LIFECYCLE_STATUS_FAILED = 6;
  AGENT_LIFECYCLE_STATUS_TERMINATED = 7;
  AGENT_LIFECYCLE_STATUS_IDLE = 8;
}

// AgentLinkType describes the relationship between linked agents.
enum AgentLinkType {
  AGENT_LINK_TYPE_UNSPECIFIED = 0;
  AGENT_LINK_TYPE_COLLABORATOR = 1;
  AGENT_LINK_TYPE_SUPERVISOR = 2;
  AGENT_LINK_TYPE_SUBORDINATE = 3;
  AGENT_LINK_TYPE_PEER = 4;
}

// AgentLinkProtocol describes how linked agents communicate.
enum AgentLinkProtocol {
  AGENT_LINK_PROTOCOL_UNSPECIFIED = 0;
  AGENT_LINK_PROTOCOL_INTERNAL = 1;
  AGENT_LINK_PROTOCOL_CHANNEL = 2;
  AGENT_LINK_PROTOCOL_WEBHOOK = 3;
}

// AgentLinkStatus tracks whether an agent link is active.
enum AgentLinkStatus {
  AGENT_LINK_STATUS_UNSPECIFIED = 0;
  AGENT_LINK_STATUS_ACTIVE = 1;
  AGENT_LINK_STATUS_PAUSED = 2;
  AGENT_LINK_STATUS_REVOKED = 3;
}

// AgentIdentity holds identity markdown files for persistent agents.
message AgentIdentity {
  string soul_md = 1;
  string identity_md = 2;
  string user_md = 3;
  string role_md = 4;
}

// AgentSandboxConfig holds sandbox resource configuration for persistent agents.
message AgentSandboxConfig {
  string image = 1;
  double cpu_limit = 2;
  int64 memory_mb = 3;
  int64 disk_mb = 4;
  int32 timeout_seconds = 5;
  string network_mode = 6;
  repeated string allowed_hosts = 7;
  map<string, string> env_vars = 8;
  bool ssh_enabled = 9;
  string git_repo_url = 10;
  string git_branch = 11;
  // When set, links the agent to an existing sandbox instead of creating a new one.
  optional string linked_session_id = 12;
}

// AgentDatabaseConfig holds paths for agent-local databases within the sandbox.
message AgentDatabaseConfig {
  string sqlite_path = 1;
  string lancedb_path = 2;
  string redb_path = 3;
}

// AgentWorkersConfig holds worker pool settings for persistent agents.
message AgentWorkersConfig {
  int32 max_concurrent_workers = 1;
  google.protobuf.Struct pool_config = 2;
}

// AgentLink represents a connection between an agent and another entity.
message AgentLink {
  string id = 1;
  string tenant_id = 2;
  string source_agent_id = 3;
  string target_type = 4;
  string target_id = 5;
  string target_name = 6;
  AgentLinkType link_type = 7;
  AgentLinkProtocol protocol = 8;
  AgentLinkStatus status = 9;
  google.protobuf.Struct config = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// AgentChannelBinding represents a channel bound to an agent.
message AgentChannelBinding {
  string id = 1;
  string agent_id = 2;
  string channel_config_id = 3;
  bool enabled = 4;
  google.protobuf.Timestamp created_at = 5;
}

// AgentDefinition is the blueprint/config for an agent.
message AgentDefinition {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  string model = 5;
  string system_prompt = 6;
  repeated string tools = 7;
  google.protobuf.Struct config = 8; // temperature, max_tokens, etc.
  int32 max_turns = 9;
  int32 max_tool_calls_per_turn = 10;
  bool enabled = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  AgentMode mode = 14;
  optional int32 max_steps = 15;
  TaskPermissionMode task_permission_mode = 16;
  bool hidden = 17;
  optional string color = 18;
  optional string working_directory = 19;
  optional string mention_alias = 20;
  AgentExecutionPolicy execution_policy = 21;
  optional AgentMemoryConfig memory_config = 22;
  // Persistent agent fields (lifecycle_mode = PERSISTENT)
  AgentLifecycleMode lifecycle_mode = 23;
  AgentLifecycleStatus lifecycle_status = 24;
  optional string icon = 25;
  AgentIdentity identity = 26;
  AgentSandboxConfig sandbox_config = 27;
  AgentDatabaseConfig database_config = 28;
  AgentWorkersConfig workers_config = 29;
  string sandbox_id = 30;
  string primary_session_id = 31;
  string active_revision_id = 32;
}

// AgentSession is an execution instance of an agent.
message AgentSession {
  string id = 1;
  string tenant_id = 2;
  string agent_id = 3;
  SessionStatus status = 4;
  int32 turn_count = 5;
  int32 total_tokens = 6;
  google.protobuf.Struct metadata = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  google.protobuf.Timestamp completed_at = 10;
  repeated AgentSessionTurn turns = 11;
  // Short summary derived from the first user message in this session.
  string summary = 12;
  string revision_id = 13;
}

// AgentSessionTurn is a single conversation turn within a session.
message AgentSessionTurn {
  string id = 1;
  string session_id = 2;
  int32 turn_number = 3;
  TurnStatus status = 4;
  string user_input = 5;
  string assistant_output = 6;
  string tool_calls = 7; // JSON-encoded tool calls
  // prompt_tokens is the inclusive input total (cached + fresh). The
  // cache_*_input_tokens fields below are non-overlapping subsets so
  // consumers can compute the fresh portion as
  //   prompt_tokens − cache_read_input_tokens − cache_write_input_tokens
  // and apply per-bucket billing rates. See gw.TokenDetails for the
  // dual-track design rationale.
  int32 prompt_tokens = 8;
  int32 completion_tokens = 9;
  int32 total_tokens = 10;
  int64 latency_ms = 11;
  string error = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp completed_at = 14;
  int32 cache_read_input_tokens = 15;
  int32 cache_write_input_tokens = 16;
  // JSON-encoded ordered turn timeline: interleaved assistant text, tool
  // calls, and HITL exchanges in true execution order. Empty for turns
  // recorded before this field existed (UI falls back to the flat fields).
  string timeline = 17;
}

// ToolCallResult is the result of executing a tool call.
message ToolCallResult {
  string tool_call_id = 1;
  string name = 2;
  string result = 3;
  bool success = 4;
  string error = 5;
}

// AgentExecutionPolicy is a typed policy container for runtime controls.
message AgentExecutionPolicy {
  TaskPermissionMode task_permission_mode = 1;
  optional int32 max_steps = 2;
  optional string working_directory = 3;
}

// --- Agent CRUD ---

message CreateAgentRequest {
  string tenant_id = 1;
  string name = 2;
  optional string description = 3;
  string model = 4;
  optional string system_prompt = 5;
  repeated string tools = 6;
  optional google.protobuf.Struct config = 7;
  optional int32 max_turns = 8;
  optional int32 max_tool_calls_per_turn = 9;
  AgentMode mode = 10;
  optional int32 max_steps = 11;
  TaskPermissionMode task_permission_mode = 12;
  optional bool hidden = 13;
  optional string color = 14;
  optional string working_directory = 15;
  optional string mention_alias = 16;
  AgentExecutionPolicy execution_policy = 17;
  optional AgentMemoryConfig memory_config = 18;
  AgentLifecycleMode lifecycle_mode = 19;
  AgentIdentity identity = 20;
  AgentSandboxConfig sandbox_config = 21;
  AgentDatabaseConfig database_config = 22;
  AgentWorkersConfig workers_config = 23;
  optional string icon = 24;
  bool auto_provision = 25;
}

message CreateAgentResponse {
  AgentDefinition agent = 1;
}

message GetAgentRequest {
  string tenant_id = 1;
  string id = 2;
}

message GetAgentResponse {
  AgentDefinition agent = 1;
}

message ListAgentsRequest {
  string tenant_id = 1;
  optional bool enabled = 2;
  optional int32 limit = 3;
  optional int32 offset = 4;
  bool include_hidden = 5;
  AgentMode mode = 6;
  AgentLifecycleMode lifecycle_mode = 7;
}

message ListAgentsResponse {
  repeated AgentDefinition agents = 1;
  int32 total = 2;
}

message UpdateAgentRequest {
  string tenant_id = 1;
  string id = 2;
  optional string name = 3;
  optional string description = 4;
  optional string model = 5;
  optional string system_prompt = 6;
  repeated string tools = 7;
  optional google.protobuf.Struct config = 8;
  optional int32 max_turns = 9;
  optional int32 max_tool_calls_per_turn = 10;
  optional bool enabled = 11;
  optional AgentMode mode = 12;
  optional int32 max_steps = 13;
  optional TaskPermissionMode task_permission_mode = 14;
  optional bool hidden = 15;
  optional string color = 16;
  optional string working_directory = 17;
  optional string mention_alias = 18;
  AgentExecutionPolicy execution_policy = 19;
  optional AgentMemoryConfig memory_config = 20;
  AgentIdentity identity = 21;
  AgentSandboxConfig sandbox_config = 22;
  AgentDatabaseConfig database_config = 23;
  AgentWorkersConfig workers_config = 24;
  optional string icon = 25;
  optional AgentLifecycleMode lifecycle_mode = 26;
  // Explicitly clears tools. Repeated fields do not preserve presence when
  // encoded empty, so clients cannot otherwise distinguish clear from omit.
  optional bool clear_tools = 27;
}

message UpdateAgentResponse {
  AgentDefinition agent = 1;
}

message DeleteAgentRequest {
  string tenant_id = 1;
  string id = 2;
}

message DeleteAgentResponse {
  bool success = 1;
  string message = 2;
}

message ImportAgentFromOpencodeRequest {
  string tenant_id = 1;
  string opencode_agent_json = 2;
  bool dry_run = 3;
}

message ImportAgentFromOpencodeResponse {
  bool valid = 1;
  repeated string warnings = 2;
  AgentDefinition agent = 3;
}

message ExportAgentToOpencodeRequest {
  string tenant_id = 1;
  string id = 2;
}

message ExportAgentToOpencodeResponse {
  string opencode_agent_json = 1;
  repeated string warnings = 2;
}

// --- Session Management ---

message CreateSessionRequest {
  string tenant_id = 1;
  string agent_id = 2;
  optional google.protobuf.Struct metadata = 3;
}

message CreateSessionResponse {
  AgentSession session = 1;
}

message GetSessionRequest {
  string tenant_id = 1;
  string id = 2;
}

message GetSessionResponse {
  AgentSession session = 1;
}

message ListSessionsRequest {
  string tenant_id = 1;
  optional string agent_id = 2;
  optional SessionStatus status = 3;
  optional int32 limit = 4;
  optional int32 offset = 5;
  optional string trooper_id = 6;
}

message ListSessionsResponse {
  repeated AgentSession sessions = 1;
  int32 total = 2;
}

// --- Runtime ---

message RunTurnRequest {
  string tenant_id = 1;
  string session_id = 2;
  string user_input = 3;
}

message RunTurnResponse {
  AgentSessionTurn turn = 1;
  SessionStatus session_status = 2;
}

message CancelSessionRequest {
  string tenant_id = 1;
  string session_id = 2;
}

message CancelSessionResponse {
  bool success = 1;
  string message = 2;
}

message CompleteSessionRequest {
  string tenant_id = 1;
  string session_id = 2;
}

message CompleteSessionResponse {
  bool success = 1;
  string message = 2;
}

// --- Streaming Runtime ---

message RunTurnStreamRequest {
  string tenant_id = 1;
  string session_id = 2;
  string user_input = 3;
  bool enable_streaming = 4;
  bool enable_web_search = 5;
}

message AgentEvent {
  string type = 1;
  string session_id = 2;
  int32 turn_number = 3;
  string text_delta = 4;
  string tool_call_id = 5;
  string tool_name = 6;
  string tool_args = 7;
  string tool_result = 8;
  bool tool_success = 9;
  int64 tool_duration_ms = 10;
  string finish_reason = 11;
  string error = 12;
  int32 prompt_tokens = 13;
  int32 completion_tokens = 14;
  int32 total_tokens = 15;
  AgentSessionTurn turn = 16; // Populated on turn.end events

  // HITL approval gate fields
  string review_id = 17;
  repeated PendingToolCall pending_tool_calls = 18;
  string approval_action = 19;

  // Sandbox execution fields
  string sandbox_id = 20;
  int32 sandbox_exit_code = 21;
  int64 sandbox_duration_ms = 22;

  // Fallback fields
  string fallback_from_model = 23;
  string fallback_to_model = 24;
  int32 fallback_attempt = 25;

  // User input (ask_user) fields
  string user_input_id = 26;

  // Cache token breakdown — non-overlapping subsets of prompt_tokens.
  // Consumers compute fresh = prompt_tokens − cache_read_tokens − cache_write_tokens.
  int32 cache_read_tokens = 27;
  int32 cache_write_tokens = 28;
}

message SteerSessionRequest {
  string tenant_id = 1;
  string session_id = 2;
  string role = 3;    // "user" or "system"
  string content = 4;
}

message SteerSessionResponse {
  bool accepted = 1;
  string message = 2;
}

// --- HITL Approval Gate ---

// ApprovalReviewStatus tracks the lifecycle of an approval review.
enum ApprovalReviewStatus {
  APPROVAL_REVIEW_STATUS_UNSPECIFIED = 0;
  APPROVAL_REVIEW_STATUS_PENDING = 1;
  APPROVAL_REVIEW_STATUS_APPROVED = 2;
  APPROVAL_REVIEW_STATUS_DENIED = 3;
  APPROVAL_REVIEW_STATUS_EXPIRED = 4;
  APPROVAL_REVIEW_STATUS_CANCELLED = 5;
}

// ApprovalAction is the action to take on a review.
enum ApprovalAction {
  APPROVAL_ACTION_UNSPECIFIED = 0;
  APPROVAL_ACTION_APPROVE = 1;
  APPROVAL_ACTION_DENY = 2;
}

// PendingToolCall describes a tool call awaiting approval.
message PendingToolCall {
  string tool_call_id = 1;
  string tool_name = 2;
  string tool_args = 3;
}

// ToolCallDecision is a per-tool approval decision (v2: per-tool overrides).
message ToolCallDecision {
  string tool_call_id = 1;
  ApprovalAction action = 2;
  string reason = 3;
}

// ApprovalReview represents a HITL approval review for tool calls.
// V1 is single-instance; multi-instance via Redis pub/sub is v2.
message ApprovalReview {
  string id = 1;
  string session_id = 2;
  string tenant_id = 3;
  string agent_id = 4;
  int32 turn_number = 5;
  int32 iteration = 6;
  ApprovalReviewStatus status = 7;
  repeated PendingToolCall tool_calls = 8;
  repeated ToolCallDecision decisions = 9;
  string default_action = 10;
  google.protobuf.Timestamp requested_at = 11;
  google.protobuf.Timestamp expires_at = 12;
  google.protobuf.Timestamp resolved_at = 13;
  string resolved_by = 14;
  string resolution_reason = 15;
}

message SubmitReviewRequest {
  string tenant_id = 1;
  string review_id = 2;
  ApprovalAction action = 3;
  repeated ToolCallDecision decisions = 4;  // v2: per-tool override
  string reason = 5;
  string resolved_by = 6;
}

message SubmitReviewResponse {
  bool accepted = 1;
  string message = 2;
  ApprovalReview review = 3;
}

message GetReviewRequest {
  string tenant_id = 1;
  string review_id = 2;
}

message GetReviewResponse {
  ApprovalReview review = 1;
}

message ListReviewsRequest {
  string tenant_id = 1;
  optional string session_id = 2;
  optional ApprovalReviewStatus status = 3;
  optional int32 limit = 4;
  optional int32 offset = 5;
}

message ListReviewsResponse {
  repeated ApprovalReview reviews = 1;
  int32 total = 2;
}

// --- Sandbox Management ---

// SandboxStatus tracks the lifecycle of a sandbox instance.
enum SandboxStatus {
  SANDBOX_STATUS_UNSPECIFIED = 0;
  SANDBOX_STATUS_PENDING = 1;
  SANDBOX_STATUS_RUNNING = 2;
  SANDBOX_STATUS_STOPPED = 3;
  SANDBOX_STATUS_FAILED = 4;
}

// SandboxInstance represents a running sandbox environment.
message SandboxInstance {
  string id = 1;
  string session_id = 2;
  string tenant_id = 3;
  string backend = 4;
  string container_id = 5;
  string image = 6;
  SandboxStatus status = 7;
  google.protobuf.Struct config = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp expires_at = 10;
  // destroy_reason indicates why the sandbox was destroyed: manual, expired, error, system.
  string destroy_reason = 11;
  // Friendly name for the sandbox (if set).
  string name = 12;
  google.protobuf.Timestamp last_used_at = 13;
  int32 idle_retention_secs = 14;
  bool keep_warm = 15;

  // Git source info (Phase 2)
  string git_repo_url = 20;
  string git_branch = 21;
  string git_commit_sha = 22;

  // Lifecycle state (Phase 3): running, stopping, stopped, reviving, terminating, terminated, failed
  string lifecycle_state = 30;
  google.protobuf.Timestamp revivable_until = 31;
  google.protobuf.Timestamp stopped_at = 32;

  // SSH info (Phase 4)
  bool ssh_enabled = 40;

  // Persistent trooper fields (Phase 5)
  bool persistent = 50;
  string agent_id = 51;

  // Public short code (Phase 6) — bitly-style 8-char identifier used as
  // the SSH username and the preview URL subdomain on *.evs.run. Stable
  // for the sandbox's lifetime. Empty for legacy rows that predate the
  // backfill.
  string short_code = 60;

  // agent_healthy mirrors the isolated-sandbox backend's health monitor
  // result at response-assembly time. true when the most recent in-
  // guest /health probe returned 204 within timeout; false when the
  // agent has stopped answering. The admin UI renders this as a small
  // green/red dot next to each sandbox label so an unresponsive sandbox
  // is visible at a glance, without needing to open Shell or Logs to
  // discover the failure.
  //
  // Other backends (Docker, K8s) always set true: they don't
  // run the in-guest probe, so this field carries the strongest signal
  // we have rather than an unhelpful "unknown."
  bool agent_healthy = 70;

  // Arbitrary key-value labels for this sandbox. Agents use these to
  // tag sandboxes by run ID, agent ID, repo, PR number, etc. Setting
  // labels via UpdateSandbox replaces the full set (PATCH semantics).
  // ListSandboxInstances supports filtering by label containment.
  map<string, string> labels = 80;

  // Auto-lifecycle fields (Phase 7 / POR-72).
  int32 auto_archive_after_days = 81;
  int32 auto_delete_after_days = 82;
  google.protobuf.Timestamp archived_at = 83;
  // snapshot_id records which named snapshot this sandbox was created from (if any).
  // Renumbered 81->84 to avoid collision with the auto-lifecycle fields above.
  string snapshot_id = 84;

  // state is the PUBLIC lifecycle label (Daytona-style vocabulary):
  // creating, starting, started, stopping, stopped, archiving,
  // archived, destroying, destroyed, error. Derived from
  // lifecycle_state; clients should branch on this rather than the
  // internal names (lifecycle_state stays for backward compatibility).
  string state = 90;
  // desired_state is what the system is converging the sandbox toward:
  // running, sleeping, archived, terminated.
  string desired_state = 91;
  // error_reason is set when state == "error" (e.g. "vm_not_found",
  // "stuck_creating"). Recover re-enters convergence.
  string error_reason = 92;
  // Daytona-style auto-lifecycle intervals, in minutes.
  //   auto_stop_interval:    0 = disabled; omitted at create = plan-tier default
  //   auto_archive_interval: 0 = disabled
  //   auto_delete_interval:  -1 = never, 0 = ephemeral (delete on stop)
  int32 auto_stop_interval = 93;
  int32 auto_archive_interval = 94;
  int32 auto_delete_interval = 95;

  // Start of the current allocated-compute billing window. This is
  // intentionally separate from created_at because the same sandbox identity
  // can sleep and revive many times. It remains present briefly while a closed
  // window is being committed to the immutable usage ledger.
  google.protobuf.Timestamp billing_started_at = 96;
  // Server-calculated age and cost of this billing window at response
  // assembly time. A pinned billing_ended_at freezes both values while the
  // immutable ledger close is retried.
  int64 current_compute_seconds = 97;
  double current_compute_cost_usd = 98;
  // First backend-confirmed end of this window. When present, compute has
  // stopped accruing even if the ledger close is still being finalized.
  google.protobuf.Timestamp billing_ended_at = 99;
}

// SandboxExecution represents a single command execution within a sandbox.
message SandboxExecution {
  string id = 1;
  string sandbox_id = 2;
  string session_id = 3;
  string tool_name = 4;
  string tool_call_id = 5;
  string language = 6;
  string command = 7;
  int32 exit_code = 8;
  string stdout = 9;
  string stderr = 10;
  int64 duration_ms = 11;
  bool timed_out = 12;
  google.protobuf.Timestamp created_at = 13;
}

// SandboxStats holds a point-in-time resource usage snapshot.
message SandboxStats {
  double cpu_percent = 1;
  int64 memory_usage = 2;
  int64 memory_limit = 3;
  double memory_percent = 4;
  int64 network_rx_bytes = 5;
  int64 network_tx_bytes = 6;
  int64 block_read = 7;
  int64 block_write = 8;
  int32 pids = 9;
  google.protobuf.Timestamp timestamp = 10;
}

// SandboxOverview provides a summary of the sandbox subsystem.
message SandboxOverview {
  int32 total_instances = 1;
  int32 running_instances = 2;
  // Customer plan concurrency for this Everstack instance. -1 means a custom
  // enterprise limit. This is not the runtime host's safety ceiling.
  int32 max_sandboxes = 3;
  string backend = 4;
  double max_cpu = 5;
  int64 max_memory_mb = 6;
  bool healthy = 7;
  // Aggregate resource usage across this tenant's running instances.
  double aggregate_cpu_percent = 8;
  int64 aggregate_memory_usage = 9;
  int64 aggregate_memory_limit = 10;
  double aggregate_memory_percent = 11;
  int64 aggregate_network_rx_bytes = 12;
  int64 aggregate_network_tx_bytes = 13;
  int64 aggregate_block_read = 14;
  int64 aggregate_block_write = 15;
  int32 aggregate_pids = 16;
  // Execution metrics from the database.
  int32 total_executions = 17;
  double avg_execution_duration_ms = 18;
  // Lifetime billing aggregates from sandbox_usage_records — the
  // immutable ledger that's also pushed to Stripe meters. These are
  // monotonically increasing across the tenant's whole history; they
  // never rewind when a sandbox is terminated. The "Cost so far" tile
  // in the admin overview should read these instead of recomputing
  // from the (filtered, paginated) in-memory instance list.
  double lifetime_cost_usd = 19;
  int64 lifetime_compute_seconds = 20;
  // Currently-open allocated-compute windows only. These are server-side
  // snapshots and never derive from sandbox created_at in the client.
  int64 active_compute_seconds = 21;
  double active_cost_usd = 22;
}

message CreateSandboxRequest {
  string tenant_id = 1;
  string session_id = 2;
  string image = 3;
  double cpu_limit = 4;
  int64 memory_mb = 5;
  int64 disk_mb = 6;
  int32 timeout_seconds = 7;
  string network_mode = 8;
  // Idle retention in seconds. 0 means no expiration (pro/enterprise).
  // When omitted, the server resolves retention from the tenant's plan tier.
  int32 idle_retention_seconds = 9;
  // If set, use template config as base. Individual fields override template defaults.
  string template_id = 10;
  // Optional friendly name for the sandbox.
  string name = 11;
  // Arbitrary key-value labels for this sandbox. Agents use these to tag
  // sandboxes by run ID, agent ID, repo, PR number, etc.
  map<string, string> labels = 12;
  // Auto-archive: days after which a stopped sandbox is archived. 0=disabled. Default: 7.
  int32 auto_archive_after_days = 13;
  // Auto-delete: days after which a stopped/archived sandbox is deleted. -1=never. Default: -1.
  int32 auto_delete_after_days = 14;
  // snapshot_id, when set, uses the named snapshot's base_image as the sandbox image.
  // Takes precedence over the image field. Renumbered 13->15 to avoid collision
  // with the auto-lifecycle fields above.
  string snapshot_id = 15;
  // network_block_all blocks all outbound egress when true.
  // Always-allowed: loopback, link-local, DNS, fcagent TAP range.
  // Overrides network_mode. Default: false. Renumbered 13->16 to avoid collision.
  bool network_block_all = 16;
  // network_allow_cidrs lists CIDR blocks to permit when network_block_all is true.
  // Max 10 entries. Example: ["10.0.0.0/8", "192.168.1.5/32"]. Renumbered 14->17.
  repeated string network_allow_cidrs = 17;

  // Git import fields (Phase 2)
  string git_repo_url = 20;
  string git_branch = 21;
  int64 git_installation_id = 22;

  // SSH toggle (Phase 4)
  bool ssh_enabled = 30;

  // Tailscale VPN: join the customer's Tailnet at boot (POR-87).
  // Pass a Tailscale auth key (ephemeral recommended); the sandbox
  // appears as a device on the Tailnet with its own IP.
  string tailscale_auth_key = 31;
  // External storage mounts (POR-88, POR-89).
  // Each mount is FUSE-mounted at boot by the sandbox-agent.
  repeated StorageMount mounts = 32;
  // Computer Use: enable Xvfb + XFCE4 desktop at boot (POR-91).
  // When true, SANDBOX_COMPUTER_USE=1 is injected and the /computer/*
  // endpoints (screenshot, mouse/keyboard, screen recording) become available.
  bool computer_use = 33;

  // Daytona-style auto-lifecycle intervals, in minutes. These are the
  // canonical knobs going forward; the day/second-granularity fields
  // above remain accepted for backward compatibility (when both are
  // supplied, the minute fields win).
  //   auto_stop_interval:    0 = omitted (plan-tier default, 15m),
  //                          negative = disabled
  //   auto_archive_interval: 0 = omitted (default 7 days), negative = disabled
  //   auto_delete_interval:  0 = ephemeral (delete on stop),
  //                          negative = never, omitted = never
  // Note on zero values: proto3 cannot distinguish 0 from absent, so
  // each field documents its own zero semantics above, mirroring
  // Daytona's API.
  int32 auto_stop_interval = 40;
  int32 auto_archive_interval = 41;
  // auto_delete_interval uses optional so 0 (ephemeral) is
  // distinguishable from absent (never).
  optional int32 auto_delete_interval = 42;
}

// StorageMount configures a FUSE-based external storage mount inside a sandbox.
message StorageMount {
  // Type: "s3" | "r2" | "gcs" | "azure"
  string type = 1;
  // Bucket (S3/R2/GCS) or container (Azure) name.
  string bucket = 2;
  // Absolute path inside the sandbox where the storage is mounted.
  string mount_path = 3;
  // Optional endpoint override (for R2, MinIO, or custom S3-compatible).
  string endpoint = 4;
  // Subpath within the bucket to expose (optional, for isolation).
  string subpath = 5;
  // Mount as read-only (default: false).
  bool read_only = 6;
}

