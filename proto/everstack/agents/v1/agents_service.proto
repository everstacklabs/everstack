    option (google.api.http) = {delete: "/v1/volumes/{volume_id}"};
  }

  // Immutable agent source revisions.
  rpc CreateAgentRevision(CreateAgentRevisionRequest) returns (CreateAgentRevisionResponse) {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {description: "Create and activate an immutable agent source revision"}
      }
    };
    option (google.api.http) = {
      post: "/v1/agents/{agent_id}/revisions"
      body: "*"
    };
  }

  rpc GetActiveAgentRevision(GetActiveAgentRevisionRequest) returns (GetActiveAgentRevisionResponse) {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {description: "Get the active source revision for an agent"}
      }
    };
    option (google.api.http) = {get: "/v1/agents/{agent_id}/revisions/active"};
  }

  rpc GetAgentRevision(GetAgentRevisionRequest) returns (GetAgentRevisionResponse) {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {description: "Get an immutable agent source revision"}
      }
    };
    option (google.api.http) = {get: "/v1/agent-revisions/{revision_id}"};
  }
}
