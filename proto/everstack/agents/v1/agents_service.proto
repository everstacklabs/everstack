syntax = "proto3";

package everstack.agents.v1;

import "google/api/annotations.proto";
import "everstack/agents/v1/agents.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/everstacklabs/everstack/pkg/grpc/everstack/agents/v1;agents";

service AgentsService {
  // Agent CRUD
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {description: "Create a new agent definition"}
      }
    };
    option (google.api.http) = {
      post: "/v1/agents"
      body: "*"
    };
  }

  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {description: "Get agent by ID"}
      }
    };
    option (google.api.http) = {get: "/v1/agents/{id}"};
  }

  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {description: "List all agents for tenant"}
      }
    };
    option (google.api.http) = {get: "/v1/agents"};
  }

  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse) {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {description: "Update agent definition"}
      }
    };
    option (google.api.http) = {
      patch: "/v1/agents/{id}"
      body: "*"
    };
  }

  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse) {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {description: "Delete agent definition"}
      }
    };
    option (google.api.http) = {delete: "/v1/agents/{id}"};
  }

  rpc ImportAgentFromOpencode(ImportAgentFromOpencodeRequest) returns (ImportAgentFromOpencodeResponse) {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
        value: {description: "Import an Opencode-compatible agent payload"}
      }
    };
    option (google.api.http) = {
      post: "/v1/agents/import/opencode"
      body: "*"
    };
  }

  rpc ExportAgentToOpencode(ExportAgentToOpencodeRequest) returns (ExportAgentToOpencodeResponse) {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      responses: {
        key: "200"
