message CompareEvalRunsRequest {
  string tenant_id = 1;
  repeated string eval_run_ids = 2;
  // When true, materialize the comparison into the comparisons table
  // (both runs must be terminal). When false (default), preview only.
  bool persist = 4;
}

message CompareEvalRunsResponse {
  repeated EvalRun eval_runs = 1;
  // Legacy untyped comparison payload; kept for backward compatibility.
  google.protobuf.Struct comparison = 2;
  // Typed per-scorer paired-bootstrap results (candidate vs baseline).
  repeated ComparisonScorerResult scorer_results = 3;
  // Composite verdict across scorers, cost, latency, and error rate.
  ComparisonVerdict overall = 5;
  // Set when persist=true: id of the materialized comparisons row.
  string comparison_id = 6;
  // How items were paired: "hash" | "dataset_item".
  string match_mode = 7;
}

// Per-scorer paired-bootstrap comparison result. Deltas are candidate -
// baseline; a positive mean_diff means the candidate scored higher.
message ComparisonScorerResult {
  string name = 1;
  double baseline_mean = 2;
  double candidate_mean = 3;
  double mean_diff = 4;
  // 95% bootstrap confidence interval on the mean per-item delta.
  double ci_low = 5;
  double ci_high = 6;
  // Two-sided bootstrap p-value for mean_diff != 0.
  double p_value = 7;
  // "improvement" | "regression" | "inconclusive" | "insufficient".
  string verdict = 8;
  // Number of paired items backing this scorer's comparison.
  int32 n = 9;
}

// Composite comparison verdict across scorer quality, cost, latency, and
// error-rate deltas.
message ComparisonVerdict {
  ComparisonGrade grade = 1;
  // Human-readable explanation naming the drivers of the grade.
  string rationale = 2;
  // Mean per-item latency delta in ms (candidate - baseline).
  double latency_delta = 3;
  // Mean per-item cost delta (candidate - baseline).
  double cost_delta = 4;
  // Failed-item rate delta (candidate - baseline), in [-1, 1].
  double error_rate_delta = 5;
  // Fraction of items that were paired: paired / max(baseline, candidate).
  double coverage = 6;
}

enum ComparisonGrade {
  COMPARISON_GRADE_UNSPECIFIED = 0;
  COMPARISON_GRADE_IMPROVEMENT = 1;
  COMPARISON_GRADE_REGRESSION = 2;
  COMPARISON_GRADE_TRADEOFF = 3;
  COMPARISON_GRADE_TIE = 4;
  COMPARISON_GRADE_INSUFFICIENT_DATA = 5;
}

// --- Comparison rows (paginated; full row payloads are never inlined in
// CompareEvalRunsResponse to stay under gRPC message-size limits) ---

message ListComparisonRowsRequest {
  string tenant_id = 1;
  string comparison_id = 2;
  int32 limit = 3;
  int32 offset = 4;
  bool only_regressions = 5;
}

message ComparisonRow {
  string input_hash = 1;
  string input_preview = 2;
  string baseline_output = 3;
  string candidate_output = 4;
  repeated ScorerCellDelta scorer_deltas = 5;
  bool regression = 6;
}

message ScorerCellDelta {
  string name = 1;
  double baseline = 2;
  double candidate = 3;
  double delta = 4;
}

message ListComparisonRowsResponse {
  repeated ComparisonRow rows = 1;
  int32 total = 2;
}

