// --- Sampling Eval Rules (online eval) ---

// SamplingEvalRule continuously samples production traces matching a
// filter and runs scorers against them. Output lands in otel_trace_scores
// via the existing score recorder. The polling runner lives in
// internal/services/eval_runner/sampling.go.
message SamplingEvalRule {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  // Filter doc using a subset of ListRichTracesRequest fields:
  // {environment, tags[], user_id, session_id, thread_id, model,
  // provider, metadata[]}. Empty doc = match all.
  google.protobuf.Struct filter_predicate = 5;
  // Sampling fraction, 0..1. Same trace is consistently in/out across
  // re-runs via stable hash.
  double sample_rate = 6;
  // Score configs to apply to each sampled trace.
  repeated string scorer_config_ids = 7;
  // How far back the runner looks per tick.
  int32 lookback_seconds = 8;
  // Polling interval. 0 = manual-only (use RunSamplingEvalRuleNow).
  int32 interval_seconds = 9;
  bool enabled = 10;
  google.protobuf.Timestamp last_run_at = 11;
  int32 last_run_trace_count = 12;
  string last_run_error = 13;
  google.protobuf.Timestamp last_processed_trace_at = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message CreateSamplingEvalRuleRequest {
  string tenant_id = 1;
  string name = 2;
  optional string description = 3;
  optional google.protobuf.Struct filter_predicate = 4;
  optional double sample_rate = 5;
  repeated string scorer_config_ids = 6;
  optional int32 lookback_seconds = 7;
  optional int32 interval_seconds = 8;
  optional bool enabled = 9;
}
message CreateSamplingEvalRuleResponse { SamplingEvalRule rule = 1; }

message GetSamplingEvalRuleRequest { string tenant_id = 1; string id = 2; }
message GetSamplingEvalRuleResponse { SamplingEvalRule rule = 1; }

message ListSamplingEvalRulesRequest {
  string tenant_id = 1;
  optional bool enabled_only = 2;
  optional int32 limit = 3;
  optional int32 offset = 4;
}
message ListSamplingEvalRulesResponse { repeated SamplingEvalRule rules = 1; int32 total = 2; }

message UpdateSamplingEvalRuleRequest {
  string tenant_id = 1;
  string id = 2;
  optional string name = 3;
  optional string description = 4;
  optional google.protobuf.Struct filter_predicate = 5;
  optional double sample_rate = 6;
  repeated string scorer_config_ids = 7;
  optional int32 lookback_seconds = 8;
  optional int32 interval_seconds = 9;
  optional bool enabled = 10;
}
message UpdateSamplingEvalRuleResponse { SamplingEvalRule rule = 1; }

message DeleteSamplingEvalRuleRequest { string tenant_id = 1; string id = 2; }
message DeleteSamplingEvalRuleResponse { bool success = 1; string message = 2; }

message RunSamplingEvalRuleNowRequest { string tenant_id = 1; string id = 2; }
message RunSamplingEvalRuleNowResponse {
  int32 traces_matched = 1;
  int32 traces_sampled = 2;
  int32 scores_recorded = 3;
  string error = 4;
}

// --- AI-generated scorers ---

// GenerateScorerRequest asks Claude (via the gateway) to draft an
// LLM-judge prompt for the user-described evaluation intent.
//
// Example payload:
//   {
//     "intent": "score how politely the assistant responded",
//     "data_type": "numeric",
//     "examples": [
//       {"input": "...", "output": "...", "label": "1.0"},
//       {"input": "...", "output": "...", "label": "0.0"},
//       ...
//     ]
//   }
message GenerateScorerRequest {
  string tenant_id = 1;
  // Free-text description of what to evaluate.
  string intent = 2;
  // Desired output type: numeric, categorical, boolean. Defaults to numeric.
  optional string data_type = 3;
  // Optional examples to ground the prompt.
  repeated GenerateScorerExample examples = 4;
}

message GenerateScorerExample {
  string input = 1;
  string output = 2;
  // Free-text label expressing the desired score for this example
  // (e.g. "1.0", "polite", "false").
  string label = 3;
}

message GenerateScorerResponse {
  // Suggested name for the score config (slug-style, e.g. "politeness").
  string suggested_name = 1;
  // The draft LLM-judge prompt template, ready to drop into
  // ScoreConfig.eval_prompt.
  string prompt = 2;
  // Echoed back so the caller can wire to ScoreConfig.data_type.
  string data_type = 3;
  // For CATEGORICAL outputs: suggested category values.
  repeated string suggested_categories = 4;
  // Anything Claude wanted to flag (ambiguity in examples, etc.).
  string notes = 5;
}

// --- Synchronous scoring (playground) ---

// ScoreOutputRequest scores a single (input, output, expected) triple against
// the named scorer configs. Used by the playground to score a grid cell live.
message ScoreOutputRequest {
  // Ignored server-side; tenant is resolved from the authenticated context.
  string tenant_id = 1;
  // The generation input (dataset row / prompt variables). Arbitrary JSON.
  google.protobuf.Value input = 2;
  // The generated output to score. Arbitrary JSON (string or structured).
  google.protobuf.Value output = 3;
  // Optional expected/reference output for scorers that compare against it.
  google.protobuf.Value expected_output = 4;
  // Optional row metadata passed through to code scorers.
  google.protobuf.Struct metadata = 5;
  // Score configs to run (must belong to the caller's tenant).
  repeated string scorer_config_ids = 6;
}

message ScoreOutputResponse {
  // scores maps score name -> value, plus "<name>_reason" and "<name>_error"
  // keys, matching the shape written into eval_run_items.scores.
  google.protobuf.Struct scores = 1;
}

// --- Playground documents ---

// Playground persists a full playground workspace (tasks, dataset, scorers,
// grid, view flags) as an opaque JSON config blob so the schema can evolve
// without migrations.
message Playground {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  google.protobuf.Struct config = 4;
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

