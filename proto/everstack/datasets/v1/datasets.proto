syntax = "proto3";

package everstack.datasets.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/everstacklabs/everstack/pkg/grpc/everstack/datasets/v1;datasets";

// Dataset represents a collection of test items for evaluation
message Dataset {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  google.protobuf.Struct metadata = 5;
  int32 item_count = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp archived_at = 9;
}

// DatasetItem represents a single test case within a dataset
message DatasetItem {
  string id = 1;
  string dataset_id = 2;
  string tenant_id = 3;
  google.protobuf.Struct input = 4;
  google.protobuf.Struct expected_output = 5;
  google.protobuf.Struct metadata = 6;
  string source_trace_id = 7;
  string source_observation_id = 8;
  string status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// DatasetVersion is an immutable snapshot of a dataset's active items.
message DatasetVersion {
  string id = 1;
  string dataset_id = 2;
  string tenant_id = 3;
  int32 version_number = 4;
  string label = 5;
  string note = 6;
  int32 item_count = 7;
  google.protobuf.Timestamp created_at = 8;
  string created_by = 9;
}

// ScoreConfigMessage is a single chat-template message for an LLM-judge scorer.
// Local copy of prompts/v1.PromptMessage to avoid cross-package wire coupling.
message ScoreConfigMessage {
  string role = 1;    // "system" | "user" | "assistant"
  // Raw text, may contain Mustache vars:
  // {{input}} {{output}} {{expected_output}} {{context}} {{metadata}}
  string content = 2;
}

// ChoiceScore maps one enumerated judge choice to a 0..1 score.
message ChoiceScore {
  string choice = 1; // e.g. "A"
  double score = 2;  // 0..1
}

// ModelParams mirrors the gateway chat-completions sampling shape so the Go
// reader maps 1:1. Only fields the /v1/chat/completions path actually honors
// are included (no penalties / verbosity / reasoning_effort — see design doc).
message ModelParams {
  optional double temperature = 1;
  optional double top_p = 2;
  optional int32 max_tokens = 3;
  repeated string stop = 4;
  optional string tool_choice = 5; // "auto" | "required" | "none"
}

// ScoreConfig defines how to score/grade evaluation outputs
message ScoreConfig {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string data_type = 4; // legacy, display-only; see scorer_type/output_type
  string description = 5;
  optional double min_value = 6;
  optional double max_value = 7;
  google.protobuf.Struct categories = 8;
  string eval_prompt = 9;
  string eval_model = 10;
  bool is_archived = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string scorer_code = 14;
  string scorer_language = 15;  // "python", "javascript", "typescript"
  bool use_sandbox = 16;

  // --- Braintrust-style scorer fields (additive) ---
  string slug = 17;                          // url/api handle, slugified from name
  string scorer_type = 18;                   // manual|llm_judge|typescript|javascript|python|builtin
  string output_type = 19;                   // numeric|boolean|categorical|choice
  repeated ScoreConfigMessage messages = 20; // multi-part chat template for llm_judge
  ModelParams model_params = 21;             // sampling knobs for llm_judge
  repeated ChoiceScore choice_scores = 22;   // choice -> 0..1 (output_type == choice)
  bool use_cot = 23;                          // chain-of-thought before the choice
  optional double pass_threshold = 24;        // 0..1 pass/fail cutoff
  bytes dag_definition = 25;                  // JSON DAG scorer definition
}

// EvalRun represents an evaluation run against a dataset
message EvalRun {
  string id = 1;
  string tenant_id = 2;
  string dataset_id = 3;
  string name = 4;
  string description = 5;
  string status = 6; // pending, running, completed, failed, cancelled
  string eval_target_type = 7;
  string eval_target_id = 8;
  google.protobuf.Struct eval_config = 9;
  repeated string scorer_config_ids = 10;
  int32 total_items = 11;
  int32 completed_items = 12;
  int32 failed_items = 13;
  google.protobuf.Struct score_summary = 14;
  google.protobuf.Timestamp started_at = 15;
  google.protobuf.Timestamp completed_at = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  bool is_baseline = 19;
  string baseline_run_id = 20;
  google.protobuf.Struct regression_result = 21;
}

// RetryEvalRunRequest restarts an eval run, optionally retrying all items.
message RetryEvalRunRequest {
  string tenant_id = 1;
  string id = 2;
  bool retry_all = 3; // true = reset all items, false = reset only failed
}

message RetryEvalRunResponse {
  EvalRun eval_run = 1;
}

// EvalRunItem represents a single item result within an eval run
message EvalRunItem {
  string id = 1;
  string eval_run_id = 2;
  string dataset_item_id = 3;
  string tenant_id = 4;
  string status = 5;
  google.protobuf.Struct output = 6;
  string trace_id = 7;
  int64 latency_ms = 8;
  double cost = 9;
  google.protobuf.Struct token_usage = 10;
  string error = 11;
  google.protobuf.Struct scores = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  google.protobuf.Struct input = 15;
  google.protobuf.Struct expected_output = 16;
}

