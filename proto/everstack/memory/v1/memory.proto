syntax = "proto3";

package everstack.memory.v1;

option go_package = "github.com/everstacklabs/everstack/pkg/grpc/everstack/memory/v1;memorypb";

import "google/protobuf/timestamp.proto";

// Collection represents a vector memory collection.
message Collection {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  string embedding_model = 5;
  int32 embedding_dimension = 6;
  string distance_metric = 7;
  int32 document_count = 8;
  map<string, string> metadata = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// Document represents a source document to be embedded and stored.
message Document {
  string content = 1;
  map<string, string> metadata = 2;
  string source = 3;
}

// SearchResult represents a single search result with score.
message SearchResult {
  string document_id = 1;
  string chunk_text = 2;
  int32 chunk_index = 3;
  float score = 4;
  map<string, string> metadata = 5;
}

// CreateCollection
message CreateCollectionRequest {
  string tenant_id = 1;
  string name = 2;
  string description = 3;
  string embedding_model = 4;
  int32 embedding_dimension = 5;
  string distance_metric = 6;
  map<string, string> metadata = 7;
}

message CreateCollectionResponse {
  Collection collection = 1;
}

// GetCollection
message GetCollectionRequest {
  string tenant_id = 1;
  string name = 2;
}

message GetCollectionResponse {
  Collection collection = 1;
}

// ListCollections
message ListCollectionsRequest {
  string tenant_id = 1;
}

message ListCollectionsResponse {
  repeated Collection collections = 1;
}

// DeleteCollection
message DeleteCollectionRequest {
  string tenant_id = 1;
  string name = 2;
}

message DeleteCollectionResponse {
  bool success = 1;
}

// AddDocuments
message AddDocumentsRequest {
  string tenant_id = 1;
  string collection_name = 2;
  repeated Document documents = 3;
  int32 chunk_size = 4;
}

message AddDocumentsResponse {
  repeated string document_ids = 1;
  int32 chunks_created = 2;
}

// DeleteDocument
message DeleteDocumentRequest {
  string collection_name = 1;
  string document_id = 2;
}

message DeleteDocumentResponse {
  bool success = 1;
}

// QueryCollection
message QueryCollectionRequest {
  string tenant_id = 1;
  string collection_name = 2;
  string query = 3;
  int32 top_k = 4;
  float min_score = 5;
  map<string, string> metadata_filter = 6;
}

message QueryCollectionResponse {
  repeated SearchResult results = 1;
}

// Analytics
message AnalyticsBucket {
  string timestamp = 1;
  int32 query_count = 2;
  int32 store_count = 3;
  int32 delete_count = 4;
  int32 error_count = 5;
  float avg_latency_ms = 6;
}

message CollectionStat {
  string collection_name = 1;
  int32 request_count = 2;
}

message GetMemoryAnalyticsRequest {
  string tenant_id = 1;
  string from = 2;
  string to = 3;
}

message GetMemoryAnalyticsResponse {
  repeated AnalyticsBucket buckets = 1;
  int32 total_requests = 2;
  int32 total_errors = 3;
  float avg_latency_ms = 4;
  repeated CollectionStat top_collections = 5;
}

// SetupPgVector
message SetupPgVectorRequest {}

message SetupPgVectorResponse {
  bool success = 1;
  string message = 2;
}
