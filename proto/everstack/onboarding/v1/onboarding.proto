syntax = "proto3";

package everstack.onboarding.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/everstacklabs/everstack/pkg/grpc/everstack/onboarding/v1;onboardingpb";

// OnboardingState is the durable, tenant-scoped slice of launch-center UI
// state. It deliberately does NOT carry a "completed" flag: completion is
// derived live from whether the tenant has providers, agents, and keys, so a
// persisted flag would go stale the moment a user deletes a provider. Only the
// genuinely-fragile bits that would otherwise live in browser localStorage are
// stored here, so they survive a cleared cache or a fresh device.
message OnboardingState {
  // The user explicitly dismissed the launch center. Not monotonic:
  // selecting a path resets it to false.
  bool dismissed = 1;
  // The "you're live" celebration has been acknowledged.
  bool celebration_shown = 2;
  // Chosen onboarding path: "agent" | "gateway" | "production" | "".
  string selected_path = 3;
  // The user skipped the optional sandbox provisioning step.
  bool sandbox_skipped = 4;
  // Server-stamped last-write time.
  google.protobuf.Timestamp updated_at = 5;
}
