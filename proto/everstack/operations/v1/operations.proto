syntax = "proto3";

package everstack.operations.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/everstacklabs/everstack/pkg/grpc/everstack/operations/v1;operations";

enum StaffRole {
  STAFF_ROLE_UNSPECIFIED = 0;
  STAFF_ROLE_VIEWER = 1;
  STAFF_ROLE_OPERATOR = 2;
  STAFF_ROLE_ADMIN = 3;
}

enum SnapshotFreshness {
  SNAPSHOT_FRESHNESS_UNSPECIFIED = 0;
  SNAPSHOT_FRESHNESS_FRESH = 1;
  SNAPSHOT_FRESHNESS_STALE = 2;
  SNAPSHOT_FRESHNESS_OFFLINE = 3;
  SNAPSHOT_FRESHNESS_UNKNOWN = 4;
}

enum SourceState {
  SOURCE_STATE_UNSPECIFIED = 0;
  SOURCE_STATE_OK = 1;
  SOURCE_STATE_STALE = 2;
  // UNAVAILABLE means the probe failed. Do not collapse it into
  // NOT_CONFIGURED: a configured source that cannot be reached needs action.
  SOURCE_STATE_UNAVAILABLE = 3;
  // NOT_CONFIGURED means this deployment does not have the source.
  SOURCE_STATE_NOT_CONFIGURED = 4;
}

enum EventSeverity {
  EVENT_SEVERITY_UNSPECIFIED = 0;
  EVENT_SEVERITY_INFO = 1;
  EVENT_SEVERITY_WARNING = 2;
  EVENT_SEVERITY_ERROR = 3;
  EVENT_SEVERITY_CRITICAL = 4;
}

enum InstallationKind {
  INSTALLATION_KIND_UNSPECIFIED = 0;
  INSTALLATION_KIND_CLOUD = 1;
  INSTALLATION_KIND_CONNECTED_SELF_HOSTED = 2;
  INSTALLATION_KIND_UNLICENSED_UNIFIED = 3;
  INSTALLATION_KIND_ISSUED_OFFLINE_CAPABLE = 4;
}

enum InstallationConnectivity {
  INSTALLATION_CONNECTIVITY_UNSPECIFIED = 0;
  INSTALLATION_CONNECTIVITY_LIVE = 1;
  INSTALLATION_CONNECTIVITY_STALE = 2;
  INSTALLATION_CONNECTIVITY_OFFLINE = 3;
  INSTALLATION_CONNECTIVITY_UNREPORTED = 4;
}

enum IdentityLinkage {
  // No linkage classification was supplied.
  IDENTITY_LINKAGE_UNSPECIFIED = 0;
  // An identity record joined to a platform user.
  IDENTITY_LINKAGE_LINKED = 1;
  // Signed up but never became a platform user.
  IDENTITY_LINKAGE_IDENTITY_ONLY = 2;
  // A platform user with no current native identity link, for example a
  // WorkOS-era account.
  IDENTITY_LINKAGE_PLATFORM_ONLY = 3;
}

enum InstanceLifecycleAction {
  INSTANCE_LIFECYCLE_ACTION_UNSPECIFIED = 0;
  INSTANCE_LIFECYCLE_ACTION_START = 1;
  INSTANCE_LIFECYCLE_ACTION_STOP = 2;
  INSTANCE_LIFECYCLE_ACTION_RESTART = 3;
}

enum AutomationKind {
  AUTOMATION_KIND_UNSPECIFIED = 0;
  AUTOMATION_KIND_AGENT_TRIGGER = 1;
  AUTOMATION_KIND_SANDBOX_CRON = 2;
  AUTOMATION_KIND_SANDBOX_WEBHOOK = 3;
  AUTOMATION_KIND_EVAL_SCHEDULE = 4;
}
enum AutomationCoverageState {
  AUTOMATION_COVERAGE_STATE_UNSPECIFIED = 0;
  AUTOMATION_COVERAGE_STATE_AVAILABLE = 1;
  AUTOMATION_COVERAGE_STATE_PARTIAL = 2;
  AUTOMATION_COVERAGE_STATE_UNAVAILABLE = 3;
}
message InstanceAutomationRun {
  string id = 1;
  string status = 2;
  int32 attempt = 3;
  // Absent when the source ledger records only completion, as sandbox ledgers do.
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp completed_at = 5;
  int64 duration_ms = 6;
}
message InstanceAutomation {
  string id = 1;
  AutomationKind kind = 2;
  string name = 3;
  string target_kind = 4;
  string target_id = 5;
  string target_name = 6;
  string trigger_type = 7;
  bool enabled = 8;
  string cron_expression = 9;
  string timezone = 10;
  string circuit_state = 11;
  int32 consecutive_failures = 12;
  google.protobuf.Timestamp last_started_at = 13;
  google.protobuf.Timestamp last_completed_at = 14;
  string last_status = 15;
  google.protobuf.Timestamp last_success_at = 16;
  google.protobuf.Timestamp next_run_at = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  repeated InstanceAutomationRun recent_runs = 20;
  bool runs_truncated = 21;
  // True only when execution history can be attributed to this automation.
  // False on legacy schemas or when older runs lack exact schedule provenance.
  bool runs_available = 22;
  string health_state = 23;
  string health_detail = 24;
  google.protobuf.Timestamp expected_run_at = 25;
}
message AutomationCoverage {
  AutomationKind kind = 1;
  AutomationCoverageState state = 2;
  google.protobuf.Timestamp as_of = 3;
  string warning = 4;
}
message ListInstanceAutomationsRequest {
  string instance_id = 1;
  AutomationKind kind = 2;
  int32 page_size = 3;
  string page_token = 4;
}
message ListInstanceAutomationsResponse {
  repeated InstanceAutomation automations = 1;
  string next_page_token = 2;
  AutomationCoverage coverage = 3;
}
message ChangeInstanceAutomationRequest {
  string instance_id = 1;
  AutomationKind kind = 2;
  string automation_id = 3;
  bool enabled = 4;
  // Compare-and-set precondition. The change is rejected if current state differs.
  bool expected_enabled = 5;
  // Operator-provided audit reason. It must not contain credentials or payloads.
  string reason = 6;
}
message ChangeInstanceAutomationResponse {
  string automation_id = 1;
  AutomationKind kind = 2;
  bool enabled = 3;
}

message SessionPrincipal {
  string subject_id = 1;
  string email = 2;
  string name = 3;
  StaffRole role = 4;
  repeated string permissions = 5;
}

message GetSessionRequest {}

message GetSessionResponse {
  SessionPrincipal principal = 1;
  repeated OperationsDataSource data_sources = 2;
  string current_data_source_id = 3;
}

message OperationsOverview {
  int64 organizations = 1;
  int64 workspaces = 2;
  int64 instances = 3;
  int64 healthy_instances = 4;
  int64 degraded_instances = 5;
  int64 stopped_instances = 6;
  int64 active_sandboxes = 7;
  int64 hosted_sites = 8;
  int64 open_abuse_reports = 9;
  int64 environments = 10;
  int64 offline_environments = 11;
  int64 installations = 12;
  int64 connected_self_hosted = 13;
  int64 visible_unlicensed = 14;
  int64 issued_licenses = 15;
  // Healthy and degraded counts are meaningful only for instances whose
  // health has actually been measured.
  int64 instances_with_measured_health = 16;
  // Until EVS-57 lands, this equals the live instance count because no health
  // measurements are written.
  int64 instances_never_health_checked = 17;
}

message GetOverviewRequest {}

message GetOverviewResponse {
  OperationsOverview overview = 1;
  repeated OperationsSourceStatus sources = 2;
}

message OperationsSourceStatus {
  string id = 1;
  string label = 2;
  SourceState state = 3;
  bool configured = 4;
  bool reachable = 5;
  google.protobuf.Timestamp checked_at = 6;
  google.protobuf.Timestamp latest_data_at = 7;
  int64 lag_seconds = 8;
  // Sanitized explanation. This must never include a DSN, credential, or raw
  // driver error that could contain either.
  string detail = 9;
}

message OrganizationSummary {
  string id = 1;
  string slug = 2;
  string name = 3;
  string plan_tier = 4;
  int64 member_count = 5;
  int64 workspace_count = 6;
  int64 instance_count = 7;
  int64 active_sandbox_count = 8;
  int64 hosted_site_count = 9;
  google.protobuf.Timestamp created_at = 10;
  // False when hosting data is isolated in a separate database and cannot be
  // joined to the platform organization inventory.
  bool hosted_site_count_available = 11;
}

message ListOrganizationsRequest {
  string search = 1;
  string plan_tier = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListOrganizationsResponse {
  repeated OrganizationSummary organizations = 1;
  string next_page_token = 2;
}

message OrganizationMemberRow {
  string everstack_user_id = 1;
  string identity_user_id = 2;
  string email = 3;
  string name = 4;
  string role = 5;
  google.protobuf.Timestamp joined_at = 6;
}

message OrganizationWorkspaceRow {
  string workspace_id = 1;
  string name = 2;
  string slug = 3;
  string environment = 4;
  google.protobuf.Timestamp created_at = 5;
  int32 explicit_member_count = 6;
  int32 instance_count = 7;
}

message OrganizationInstanceRow {
  string instance_id = 1;
  string slug = 2;
  string workspace_id = 3;
  string status = 4;
  string region = 5;
  // Per EVS-57, healthy is only meaningful when last_health_check is set.
  bool healthy = 6;
  google.protobuf.Timestamp last_health_check = 7;
  google.protobuf.Timestamp deleted_at = 8;
}

// SECURITY: The secret invite token is deliberately absent. NEVER add it here.
message OrganizationInvitationRow {
  string email = 1;
  string role = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  bool accepted = 5;
}

message OrganizationDetail {
  string id = 1;
  string name = 2;
  string slug = 3;
  string plan_tier = 4;
  google.protobuf.Timestamp created_at = 5;
  repeated OrganizationMemberRow members = 6;
  repeated OrganizationWorkspaceRow workspaces = 7;
  repeated OrganizationInstanceRow instances = 8;
  repeated OrganizationInvitationRow invitations = 9;
}

message GetOrganizationRequest {
  string organization_id = 1;
  // Historical instances are opt-in; the default returns only live instances.
  bool include_deleted_instances = 2;
}

message GetOrganizationResponse {
  OrganizationDetail organization = 1;
  // Sections fail independently. Unavailable must never be displayed as none.
  bool members_unavailable = 2;
  bool workspaces_unavailable = 3;
  bool instances_unavailable = 4;
  bool invitations_unavailable = 5;
}

message InstallationSummary {
  string id = 1;
  string source_id = 2;
  InstallationKind kind = 3;
  InstallationConnectivity connectivity = 4;
  string organization_id = 5;
  string organization_slug = 6;
  string organization_name = 7;
  string plan_tier = 8;
  string license_status = 9;
  string version = 10;
  string region = 11;
  string gateway_url = 12;
  string fingerprint_prefix = 13;
  bool live_telemetry = 14;
  google.protobuf.Struct usage = 15;
  google.protobuf.Timestamp first_seen_at = 16;
  google.protobuf.Timestamp last_seen_at = 17;
  google.protobuf.Timestamp activated_at = 18;
  google.protobuf.Timestamp expires_at = 19;
}

message ListInstallationsRequest {
  string search = 1;
  InstallationKind kind = 2;
  InstallationConnectivity connectivity = 3;
  string plan_tier = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListInstallationsResponse {
  repeated InstallationSummary installations = 1;
  string next_page_token = 2;
}

message LicenseSummary {
  string id = 1;
  string instance_id = 2;
  string plan_tier = 3;
  string status = 4;
  bool has_live_installation = 5;
  google.protobuf.Timestamp last_seen_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListLicensesRequest {
  string search = 1;
  string plan_tier = 2;
  string status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListLicensesResponse {
  repeated LicenseSummary licenses = 1;
  string next_page_token = 2;
}

message InstanceSummary {
  string id = 1;
  string organization_id = 2;
  string organization_slug = 3;
  string organization_name = 4;
  string workspace_id = 5;
  string workspace_slug = 6;
  string workspace_name = 7;
  string slug = 8;
  string gateway_url = 9;
  string status = 10;
  string version = 11;
  string environment = 12;
  string region = 13;
  string backend_type = 14;
  bool healthy = 15;
  google.protobuf.Timestamp last_health_check = 16;
  string last_health_error = 17;
  double cpu_limit = 18;
  int64 memory_mb = 19;
  int64 disk_mb = 20;
  int64 sandbox_count = 21;
  int64 active_sandbox_count = 22;
  int64 agent_count = 23;
  int64 hosted_site_count = 24;
  google.protobuf.Timestamp created_at = 25;
  google.protobuf.Timestamp updated_at = 26;
  // False when hosting data is isolated in a separate database and cannot be
  // joined to this platform instance record.
  bool hosted_site_count_available = 27;
}

message ListInstancesRequest {
  string search = 1;
  string status = 2;
  string region = 3;
  string organization_id = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListInstancesResponse {
  repeated InstanceSummary instances = 1;
  string next_page_token = 2;
}

message GetInstanceRequest {
  string instance_id = 1;
}

message GetInstanceResponse {
  InstanceSummary instance = 1;
}

message ChangeInstanceLifecycleRequest {
  string instance_id = 1;
  InstanceLifecycleAction action = 2;
}

message ChangeInstanceLifecycleResponse {
  string instance_id = 1;
  InstanceLifecycleAction action = 2;
}

message SandboxSummary {
  string id = 1;
  string instance_id = 2;
  string session_id = 3;
  string backend = 4;
  string image = 5;
  string status = 6;
  string lifecycle_state = 7;
  string desired_state = 8;
  string agent_id = 9;
  bool persistent = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp last_used_at = 13;
  string error_reason = 14;
}

message ListSandboxesRequest {
  string instance_id = 1;
  string status = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListSandboxesResponse {
  repeated SandboxSummary sandboxes = 1;
  string next_page_token = 2;
}

message NodeSnapshot {
  string name = 1;
  bool ready = 2;
  bool unschedulable = 3;
  string architecture = 4;
  string instance_type = 5;
  string zone = 6;
  int64 cpu_capacity_milli = 7;
  int64 memory_capacity_bytes = 8;
  map<string, string> labels = 9;
  string operating_system = 10;
  string os_image = 11;
  string kernel_version = 12;
  string container_runtime_version = 13;
  string provider_id = 14;
  repeated NodeAddress addresses = 15;
  string pod_cidr = 16;
  int64 cpu_allocatable_milli = 17;
  int64 memory_allocatable_bytes = 18;
  repeated NodeConditionSnapshot conditions = 19;
  string region = 20;
  string uid = 21;
  int64 ephemeral_storage_capacity_bytes = 22;
  int64 ephemeral_storage_allocatable_bytes = 23;
  ResourceUsageSnapshot usage = 24;
  FilesystemUsageSnapshot disk_usage = 25;
}

message ResourceUsageSnapshot {
  google.protobuf.Timestamp collected_at = 1;
  int64 cpu_milli = 2;
  int64 memory_bytes = 3;
}
message FilesystemUsageSnapshot {
  google.protobuf.Timestamp collected_at = 1;
  int64 capacity_bytes = 2;
  int64 available_bytes = 3;
  string mountpoint = 4;
}
message ResourceRequirementsSnapshot {
  int64 cpu_milli = 1;
  int64 memory_bytes = 2;
  int64 ephemeral_storage_bytes = 3;
}
message ContainerSnapshot {
  string name = 1;
  string image = 2;
  bool ready = 3;
  int32 restart_count = 4;
  string state = 5;
  string reason = 6;
  ResourceRequirementsSnapshot requests = 7;
  ResourceRequirementsSnapshot limits = 8;
  ResourceUsageSnapshot usage = 9;
  bool is_init = 10;
}
message PodSnapshot {
  string uid = 1;
  string namespace = 2;
  string name = 3;
  string node_name = 4;
  string phase = 5;
  bool ready = 6;
  int32 restart_count = 7;
  string reason = 8;
  google.protobuf.Timestamp started_at = 9;
  string workload_kind = 10;
  string workload_name = 11;
  ResourceUsageSnapshot usage = 12;
  repeated ContainerSnapshot containers = 13;
}

message NodeAddress {
  string type = 1;
  string address = 2;
}
message NodeConditionSnapshot {
  string type = 1;
  string status = 2;
  string reason = 3;
  google.protobuf.Timestamp last_transition_at = 4;
}
message NetworkPortSnapshot {
  string name = 1;
  string protocol = 2;
  int32 port = 3;
  string target_port = 4;
  int32 node_port = 5;
}
message NetworkServiceSnapshot {
  string namespace = 1;
  string name = 2;
  string type = 3;
  string cluster_ip = 4;
  repeated string external_ips = 5;
  repeated NetworkPortSnapshot ports = 6;
  int32 ready_endpoints = 7;
  int32 total_endpoints = 8;
  map<string, string> labels = 9;
}
message IngressRouteSnapshot {
  string host = 1;
  string path = 2;
  string path_type = 3;
  string service_name = 4;
  string service_port = 5;
}
message IngressSnapshot {
  string namespace = 1;
  string name = 2;
  string class_name = 3;
  repeated string hosts = 4;
  repeated string addresses = 5;
  repeated int32 ports = 6;
  map<string, string> labels = 7;
  repeated IngressRouteSnapshot routes = 8;
}
enum CollectionState {
  COLLECTION_STATE_UNSPECIFIED = 0;
  COLLECTION_STATE_AVAILABLE = 1;
  COLLECTION_STATE_PARTIAL = 2;
  COLLECTION_STATE_UNAVAILABLE = 3;
}
message CollectionAvailability {
  string collection = 1;
  CollectionState state = 2;
  string warning = 3;
}

message WorkloadSnapshot {
  string namespace = 1;
  string kind = 2;
  string name = 3;
  int32 ready = 4;
  int32 desired = 5;
  int32 available = 6;
  string image = 7;
  map<string, string> labels = 8;
}

message FirecrackerAgentSnapshot {
  string name = 1;
  string endpoint = 2;
  bool ready = 3;
  string version = 4;
  google.protobuf.Timestamp last_seen_at = 5;
}

message EnvironmentSnapshot {
  string environment_id = 1;
  google.protobuf.Timestamp collected_at = 2;
  string agent_version = 3;
  string kubernetes_version = 4;
  repeated NodeSnapshot nodes = 5;
  repeated WorkloadSnapshot workloads = 6;
  repeated FirecrackerAgentSnapshot firecracker_agents = 7;
  repeated string warnings = 8;
  repeated NetworkServiceSnapshot network_services = 9;
  repeated IngressSnapshot ingresses = 10;
  repeated CollectionAvailability collections = 11;
  repeated PodSnapshot pods = 12;
}

message EnvironmentSummary {
  string id = 1;
  string name = 2;
  string region = 3;
  bool enabled = 4;
  SnapshotFreshness freshness = 5;
  google.protobuf.Timestamp last_poll_at = 6;
  google.protobuf.Timestamp snapshot_at = 7;
  string last_error = 8;
  int32 node_count = 9;
  int32 ready_node_count = 10;
  int32 workload_count = 11;
  int32 unhealthy_workload_count = 12;
  int32 firecracker_agent_count = 13;
}

message ListEnvironmentsRequest {}

message ListEnvironmentsResponse {
  repeated EnvironmentSummary environments = 1;
}

message GetEnvironmentRequest {
  string environment_id = 1;
}

message GetEnvironmentResponse {
  EnvironmentSummary environment = 1;
  EnvironmentSnapshot snapshot = 2;
}

enum ImpactCertainty {
  IMPACT_CERTAINTY_UNSPECIFIED = 0;
  // Authoritative placement ties this instance to the component.
  IMPACT_CERTAINTY_DIRECT = 1;
  // A shared service every instance in the environment depends on. This is
  // not proof that any one customer is affected.
  IMPACT_CERTAINTY_POTENTIAL = 2;
  // No relationship can be established from stored metadata. Never display
  // this as "unaffected".
  IMPACT_CERTAINTY_UNMAPPED = 3;
}

message AffectedInstance {
  string instance_id = 1;
  string slug = 2;
  string organization_id = 3;
  string organization_name = 4;
  ImpactCertainty certainty = 5;
  string basis = 6;
}

message WorkloadImpact {
  ImpactCertainty certainty = 1;
  // Counts describe the exact returned instance set. If the complete set
  // exceeds the response bound, impact_unavailable is true instead.
  int32 direct_count = 2;
  int32 potential_count = 3;
  // Collection time of the snapshot used to identify the component.
  google.protobuf.Timestamp mapping_as_of = 4;
  string explanation = 5;
  repeated AffectedInstance instances = 6;
}

message GetWorkloadRequest {
  string environment_id = 1;
  string namespace = 2;
  string kind = 3;
  string name = 4;
}

message GetWorkloadResponse {
  // Identity only when workload_missing or snapshot_unavailable is true.
  WorkloadSnapshot workload = 1;
  google.protobuf.Timestamp collected_at = 2;
  bool snapshot_stale = 3;
  WorkloadImpact impact = 4;
  repeated OperationsEvent related_events = 5;
  repeated Incident related_incidents = 6;
  // Missing from a successfully collected current snapshot, not a 404.
  bool workload_missing = 7;
  EnvironmentSummary environment = 8;
  bool snapshot_unavailable = 9;
  bool impact_unavailable = 10;
  bool related_events_unavailable = 11;
  bool related_incidents_unavailable = 12;
  // Inclusive bounds used for related_events, preserved even for empty results.
  google.protobuf.Timestamp events_since = 13;
  google.protobuf.Timestamp events_until = 14;
  string data_source_id = 15;
}

message OperationsEvent {
  string id = 1;
  string environment_id = 2;
  string kind = 3;
  EventSeverity severity = 4;
  string message = 5;
  google.protobuf.Struct details = 6;
  google.protobuf.Timestamp observed_at = 7;
}

message ListEventsRequest {
  string environment_id = 1;
  EventSeverity minimum_severity = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListEventsResponse {
  repeated OperationsEvent events = 1;
  string next_page_token = 2;
}

message AuditEvent {
  string id = 1;
  string actor_id = 2;
  string actor_email = 3;
  StaffRole actor_role = 4;
  string action = 5;
  string target_type = 6;
  string target_id = 7;
  string request_id = 8;
  string outcome = 9;
  google.protobuf.Struct metadata = 10;
  google.protobuf.Timestamp occurred_at = 11;
  string data_source_id = 12;
}

message ListAuditEventsRequest {
  string actor_id = 1;
  string action = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
}

// Identity records describe human authentication state only. Organization
// memberships, product roles, billing, and instance access remain in the
// Everstack platform model and are intentionally not editable here.
message IdentityOverview {
  string backend = 1;
  bool healthy = 2;
  int64 total_users = 3;
  int64 verified_users = 4;
  int64 active_sessions = 5;
  int64 linked_everstack_users = 6;
  repeated string enabled_methods = 7;
}

message GetIdentityOverviewRequest {}

message GetIdentityOverviewResponse {
  IdentityOverview overview = 1;
}

message IdentityUserSummary {
  // Empty for PLATFORM_ONLY rows.
  string identity_user_id = 1;
  // Empty for IDENTITY_ONLY rows.
  string everstack_user_id = 2;
  string email = 3;
  bool email_verified = 4;
  string name = 5;
  string image_url = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp last_active_at = 9;
  int32 active_session_count = 10;
  repeated string authentication_methods = 11;
  IdentityLinkage linkage = 12;
  int32 organization_count = 13;
}

message ListIdentityUsersRequest {
  string search = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListIdentityUsersResponse {
  repeated IdentityUserSummary users = 1;
  int64 total = 2;
  string next_page_token = 3;
  // True when the identity schema could not be read.
  bool identity_unavailable = 4;
}

message WorkspaceAccess {
  string workspace_id = 1;
  string workspace_name = 2;
  string workspace_slug = 3;
  string role = 4;
  string environment = 5;
  // explicit is a workspace_members row; implicit is owner/admin access, as
  // defined by services/auth/internal/service/organization_service.go.
  string access_source = 6;
}

message OrganizationMembership {
  string organization_id = 1;
  string organization_name = 2;
  string organization_slug = 3;
  string plan_tier = 4;
  string role = 5;
  google.protobuf.Timestamp joined_at = 6;
  int32 instance_count = 7;
  repeated WorkspaceAccess workspaces = 8;
  // True when the organization has workspaces the user is not a member of.
  bool workspace_access_restricted = 9;
}

message GetCustomerUserRequest {
  // At least one identifier must be set.
  string identity_user_id = 1;
  string everstack_user_id = 2;
}

message GetCustomerUserResponse {
  IdentityUserSummary user = 1;
  repeated OrganizationMembership memberships = 2;
  // True when the platform database could not be read.
  bool memberships_unavailable = 3;
  // True when the identity schema could not be read.
  bool identity_unavailable = 4;
}

message IdentitySessionSummary {
  string id = 1;
  string identity_user_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  string ip_address = 6;
  string user_agent = 7;
}

message ListIdentitySessionsRequest {
  string identity_user_id = 1;
}

message ListIdentitySessionsResponse {
  repeated IdentitySessionSummary sessions = 1;
}

message RevokeIdentitySessionRequest {
  string session_id = 1;
}

message RevokeIdentitySessionResponse {
  bool revoked = 1;
}

// Identity connections are upstream workforce OIDC providers used by the
// Everstack-native Cloud login UI. Secrets are write-only and never appear in
// this control-plane representation.
message IdentityConnectionSummary {
  string id = 1;
  string provider_id = 2;
  string display_name = 3;
  string issuer = 4;
  repeated string domains = 5;
  string client_id = 6;
  bool client_secret_configured = 7;
  repeated string scopes = 8;
  bool enabled = 9;
  string callback_url = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Every workforce connection belongs to exactly one Everstack organization.
  // Empty is possible only for legacy rows that must be assigned before use.
  string organization_id = 13;
}

message ListIdentityConnectionsRequest {}

message ListIdentityConnectionsResponse {
  repeated IdentityConnectionSummary connections = 1;
}

message UpsertIdentityConnectionRequest {
  // Empty creates a connection. A populated ID updates the existing
  // connection; provider_id is immutable and an empty client_secret preserves
  // the current write-only secret.
  string id = 1;
  string provider_id = 2;
  string display_name = 3;
  string issuer = 4;
  repeated string domains = 5;
  string client_id = 6;
  string client_secret = 7;
  repeated string scopes = 8;
  bool enabled = 9;
  string organization_id = 10;
}

message UpsertIdentityConnectionResponse {
  IdentityConnectionSummary connection = 1;
}

message DeleteIdentityConnectionRequest {
  string id = 1;
}

message DeleteIdentityConnectionResponse {
  bool deleted = 1;
}

message GetAgentSnapshotRequest {
  string environment_id = 1;
}

message GetAgentSnapshotResponse {
  EnvironmentSnapshot snapshot = 1;
}

message OperationsDataSource {
  string id = 1;
  string name = 2;
  bool read_only = 3;
  bool default = 4;
}

// ── Incidents ───────────────────────────────────────────────────────
//
// One inbox for two engines. Alertmanager-sourced and rule-engine-sourced
// incidents share this shape so the console never has to care which produced
// a given row.

enum IncidentSeverity {
  INCIDENT_SEVERITY_UNSPECIFIED = 0;
  INCIDENT_SEVERITY_INFO = 1;
  INCIDENT_SEVERITY_WARNING = 2;
  INCIDENT_SEVERITY_CRITICAL = 3;
}

enum IncidentStatus {
  INCIDENT_STATUS_UNSPECIFIED = 0;
  INCIDENT_STATUS_FIRING = 1;
  INCIDENT_STATUS_ACKNOWLEDGED = 2;
  INCIDENT_STATUS_RESOLVED = 3;
}

message Incident {
  string id = 1;
  // Dedupe key. A condition repeating every ten seconds updates one row
  // rather than creating thousands, and this is what identifies it.
  string fingerprint = 2;
  // alertmanager | rules | manual
  string source = 3;
  string rule_key = 4;
  string title = 5;
  string summary = 6;
  string runbook_url = 7;
  IncidentSeverity severity = 8;
  IncidentStatus status = 9;
  string environment = 10;
  string subject_kind = 11;
  string subject_id = 12;
  map<string, string> labels = 13;
  map<string, string> annotations = 14;
  // Absent when the incident is not threshold-based.
  optional double value = 15;
  optional double threshold = 16;
  // How many times the condition has been observed. Large numbers here are
  // normal and are the point: they mean dedupe is working.
  int32 occurrence_count = 17;
  google.protobuf.Timestamp first_seen_at = 18;
  google.protobuf.Timestamp last_seen_at = 19;
  google.protobuf.Timestamp resolved_at = 20;
  string acknowledged_by = 21;
  google.protobuf.Timestamp acknowledged_at = 22;
  google.protobuf.Timestamp snoozed_until = 23;
  // Names the data source whose control plane owns this incident.
  string data_source_id = 24;
  // Human workflow, deliberately separate from `status`, which is the observed
  // condition. A recurrence re-fires the condition; it must not erase that
  // somebody had taken ownership.
  string assigned_to = 25;
  google.protobuf.Timestamp assigned_at = 26;
  string resolution_note = 27;
  // Optimistic-concurrency token. A mutation sends back the value it last saw
  // so a second operator cannot silently overwrite the first.
  google.protobuf.Timestamp updated_at = 28;
}

message IncidentEvent {
  string id = 1;
  string incident_id = 2;
  // fired | escalated | notified | acknowledged | snoozed | resolved | comment
  string kind = 3;
  string actor_id = 4;
  string actor_email = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListIncidentsRequest {
  string status = 1;
  string severity = 2;
  string environment = 3;
  string source = 4;
  // Resolved incidents are excluded by default so the inbox shows what still
  // needs a human.
  bool include_resolved = 5;
  int32 page_size = 6;
  string page_token = 7;
}

message ListIncidentsResponse {
  repeated Incident incidents = 1;
  string next_page_token = 2;
  // Counts across the whole open set, not just this page, so the console can
  // show an accurate badge without fetching everything.
  int32 firing_critical = 3;
  int32 firing_warning = 4;
  int32 firing_info = 5;
}

message GetIncidentRequest {
  string id = 1;
}

message GetIncidentResponse {
  Incident incident = 1;
  repeated IncidentEvent timeline = 2;
}

message AcknowledgeIncidentRequest {
  string id = 1;
  string note = 2;
}

message AcknowledgeIncidentResponse {
  Incident incident = 1;
}

message SnoozeIncidentRequest {
  string id = 1;
  // Minutes from now. Snoozing keeps the incident firing but stops it paging,
  // which is different from resolving something that is still broken.
  int32 minutes = 2;
  string reason = 3;
}

message SnoozeIncidentResponse {
  Incident incident = 1;
}

message AssignIncidentRequest {
  string incident_id = 1;
  // Empty clears the assignment.
  string assignee = 2;
  // The `updated_at` the operator last saw. Omit only for machine callers.
  google.protobuf.Timestamp expected_updated_at = 3;
}

message AssignIncidentResponse {
  Incident incident = 1;
}

message AddIncidentNoteRequest {
  string incident_id = 1;
  string note = 2;
  google.protobuf.Timestamp expected_updated_at = 3;
}

message AddIncidentNoteResponse {
  Incident incident = 1;
}

message ListIncidentsForSubjectRequest {
  string subject_kind = 1;
  string subject_id = 2;
  bool include_resolved = 3;
}

message ListIncidentsForSubjectResponse {
  repeated Incident active = 1;
  repeated Incident historical = 2;
}

message ResolveIncidentRequest {
  string id = 1;
  string note = 2;
}

message ResolveIncidentResponse {
  Incident incident = 1;
}

message AlertRule {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  string category = 5;
  IncidentSeverity severity = 6;
  // rules | prometheus
  string engine = 7;
  string signal = 8;
  string comparator = 9;
  double threshold = 10;
  bool enabled = 11;
  // Why a builtin ships dark. Surfaced so a disabled rule is never mistaken
  // for a healthy one.
  string disabled_reason = 12;
  google.protobuf.Timestamp muted_until = 13;
  bool builtin = 14;
}

message ListAlertRulesRequest {}

message ListAlertRulesResponse {
  repeated AlertRule rules = 1;
}

message NotificationTarget {
  string id = 1;
  string name = 2;
  // channel | webhook
  string target_type = 3;
  string platform = 4;
  IncidentSeverity min_severity = 5;
  int32 priority = 6;
  bool enabled = 7;
  // Delivery health, so a target that has silently stopped working is visible.
  google.protobuf.Timestamp last_delivered_at = 8;
  string last_error = 9;
}

message ListNotificationTargetsRequest {}

message ListNotificationTargetsResponse {
  repeated NotificationTarget targets = 1;
}

// InstanceErrorGroup is one failure message and how often it occurred.
//
// Deliberately not classified into categories: the telemetry carries no
// normalized error type, so grouping by message reports what happened, while
// deriving categories from the free-text message would mislabel every message
// whose wording changes.
message InstanceErrorGroup {
  string message = 1;
  string status_code = 2;
  int64 count = 3;
}

// DiagnosticsCoverage is how much of this instance's activity we can actually
// see. Without it, "few requests" and "we cannot see this customer's requests"
// look identical on the page.
message DiagnosticsCoverage {
  int64 spans_in_window = 1;
  int64 spans_with_tenant = 2;
  google.protobuf.Timestamp newest_span = 3;
  bool telemetry_readable = 4;
  // Plain-language statement of what the numbers below do and do not cover.
  string note = 5;
}

message GetInstanceDiagnosticsRequest {
  string instance_id = 1;
}

message GetInstanceDiagnosticsResponse {
  google.protobuf.Timestamp window_start = 1;
  google.protobuf.Timestamp window_end = 2;
  int64 requests = 3;
  int64 failed = 4;
  double p50_millis = 5;
  double p95_millis = 6;
  google.protobuf.Timestamp last_active = 7;
  repeated InstanceErrorGroup errors = 8;
  DiagnosticsCoverage coverage = 9;
}
