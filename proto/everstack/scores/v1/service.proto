syntax = "proto3";

package everstack.scores.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/everstacklabs/everstack/pkg/grpc/everstack/scores/v1;scores";

// ScoreService provides APIs for submitting and querying evaluation scores
service ScoreService {
  // SubmitScore adds a new evaluation score to a trace or observation
  rpc SubmitScore(SubmitScoreRequest) returns (SubmitScoreResponse);
  
  // SubmitScoreBatch adds multiple scores in a single request
  rpc SubmitScoreBatch(SubmitScoreBatchRequest) returns (SubmitScoreBatchResponse);
  
  // GetScoresByTrace retrieves all scores for a specific trace
  rpc GetScoresByTrace(GetScoresByTraceRequest) returns (GetScoresByTraceResponse);
}

message SubmitScoreRequest {
  // Required: Trace ID this score belongs to
  string trace_id = 1;
  
  // Optional: Specific span/observation ID within the trace
  string observation_id = 2;
  
  // Required: Score name (e.g., "quality", "accuracy", "coherence")
  string name = 3;
  
  // Required: Score data type
  ScoreDataType data_type = 4;
  
  // Score values (only one should be set based on data_type)
  optional double numeric_value = 5;
  optional string string_value = 6;
  optional bool boolean_value = 7;
  
  // Optional: How this score was created
  ScoreSource source = 8;
  
  // Optional: Human-readable comment
  string comment = 9;
  
  // Optional: User who created the score
  string author_user_id = 10;
  
  // Optional: Additional metadata
  google.protobuf.Struct metadata = 11;
  
  // Optional: Reference to score config
  string config_id = 12;
  
  // Optional: Reference to annotation queue
  string queue_id = 13;
  
  // Optional: Environment identifier
  string environment = 14;
}

message SubmitScoreResponse {
  // Generated score ID
  string score_id = 1;
  
  // Whether the score was successfully recorded
  bool success = 2;
  
  // Error message if success = false
  string error = 3;
}

message SubmitScoreBatchRequest {
  repeated SubmitScoreRequest scores = 1;
}

message SubmitScoreBatchResponse {
  // Number of scores successfully recorded
  int32 success_count = 1;
  
  // Number of scores that failed
  int32 failure_count = 2;
  
  // Individual results for each score
  repeated SubmitScoreResponse results = 3;
}

message GetScoresByTraceRequest {
  string trace_id = 1;
}

message GetScoresByTraceResponse {
  repeated Score scores = 1;
}

message Score {
  string id = 1;
  string trace_id = 2;
  string observation_id = 3;
  google.protobuf.Timestamp timestamp = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  
  string name = 7;
  ScoreSource source = 8;
  ScoreDataType data_type = 9;
  
  // Score values
  optional double numeric_value = 10;
  optional string string_value = 11;
  optional bool boolean_value = 12;
  
  string comment = 13;
  string author_user_id = 14;
  string config_id = 15;
  string queue_id = 16;
  google.protobuf.Struct metadata = 17;
  string environment = 18;
}

enum ScoreDataType {
  SCORE_DATA_TYPE_UNSPECIFIED = 0;
  SCORE_DATA_TYPE_NUMERIC = 1;
  SCORE_DATA_TYPE_CATEGORICAL = 2;
  SCORE_DATA_TYPE_BOOLEAN = 3;
}

enum ScoreSource {
  SCORE_SOURCE_UNSPECIFIED = 0;
  SCORE_SOURCE_ANNOTATION = 1;  // Manual annotation by human
  SCORE_SOURCE_API = 2;          // Submitted via API
  SCORE_SOURCE_EVAL = 3;         // Generated by automated evaluation
}

